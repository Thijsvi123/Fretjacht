<style>
/* Layout: telefoon eerst. Menu met oefeningen; elk oefenscherm = opdracht, hals op echte schaal, knoppen, opties, scores. */
:root {
  --bg: #EEF0F3; --surface: #FFFFFF; --surface-2: #F5F6F8; --ink: #1A1814; --muted: #615C56; --line: #D9DCE1; --led-off: #E3E6EA;
  --accent: #F5A31A; --accent-ink: #2B1A14; --accent-text: #9A5200; --accent-soft: #FDEFD3; --accent-deep: #C26A0A;
  --ok: #1D8A4C; --ok-ink: #FFFFFF; --ok-soft: #DDF2E5; --bad: #C2412D; --bad-soft: #F9E1DC;
  --wood: #E8CB93; --wood-2: #D7B06A; --fret: #A3A9B0; --fret-hi: #EEF0F2; --nut: #F6F1E3; --inlay: #2B2420;
  --string: #7F848B; --wound: #9C7F4E; --wound-hi: #E2CFA4;
  --heat-0: #C9CED6; --heat-1: #22A05A; --heat-2: #8DBF3A; --heat-3: #E8B21C; --heat-4: #E8770C; --heat-5: #D2412D;
  --display: "Bricolage Grotesque", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: var(--body);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15110F; --surface: #1F1A17; --surface-2: #28221E; --ink: #F3EDE7; --muted: #ADA39A; --line: #3A322C; --led-off: #2F2824;
    --accent: #F7AE35; --accent-ink: #2B1A14; --accent-text: #FFC266; --accent-soft: #3D2C14; --accent-deep: #A8600E;
    --ok: #3CC475; --ok-ink: #0C1A12; --ok-soft: #173326; --bad: #F07A62; --bad-soft: #3A1E19;
    --wood: #3B231A; --wood-2: #2C1912; --fret: #8C9299; --fret-hi: #CDD1D6; --nut: #E9E3D2; --inlay: #E8E1D1;
    --string: #B8BDC4; --wound: #B39662; --wound-hi: #E6D3A6;
    --heat-0: #4A505B; --heat-1: #34C072; --heat-2: #A3CF4A; --heat-3: #F2C230; --heat-4: #F28A2A; --heat-5: #F0604A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15110F; --surface: #1F1A17; --surface-2: #28221E; --ink: #F3EDE7; --muted: #ADA39A; --line: #3A322C; --led-off: #2F2824;
  --accent: #F7AE35; --accent-ink: #2B1A14; --accent-text: #FFC266; --accent-soft: #3D2C14; --accent-deep: #A8600E;
  --ok: #3CC475; --ok-ink: #0C1A12; --ok-soft: #173326; --bad: #F07A62; --bad-soft: #3A1E19;
  --wood: #3B231A; --wood-2: #2C1912; --fret: #8C9299; --fret-hi: #CDD1D6; --nut: #E9E3D2; --inlay: #E8E1D1;
  --string: #B8BDC4; --wound: #B39662; --wound-hi: #E6D3A6;
  --heat-0: #4A505B; --heat-1: #34C072; --heat-2: #A3CF4A; --heat-3: #F2C230; --heat-4: #F28A2A; --heat-5: #F0604A;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased;
  padding-inline: 16px;
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 980px; margin: 0 auto; display: grid; gap: 12px; }
a { color: inherit; }

/* kop */
.top { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.brand { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 800 semi-condensed 30px/1 var(--display); min-width: 0; }
body[data-view="mode"] .brand h1, body[data-view="settings"] .brand h1 { font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal; max-width: 100%; }
@media (max-width: 560px) {
  body[data-view="mode"] .brand h1, body[data-view="settings"] .brand h1 { font-size: 22px; }
}
.back { width: 40px; height: 40px; padding: 0; border-radius: 50%; font: 500 26px/1 var(--body); display: grid; place-items: center; flex: none; }

.msg { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 12px 14px; }
.okmsg { border: 1px solid var(--ok); background: var(--ok-soft); border-radius: 10px; padding: 12px 14px; font-weight: 500; }

/* kaarten */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.eyebrow { margin: 0; font: 600 13px/1.25 var(--body); color: var(--muted); }
.help { font-size: 13px; line-height: 1.45; color: var(--muted); }
.help.block { display: block; margin-top: 2px; }
.lead { margin: 8px 0 0; max-width: 62ch; }
.muted { color: var(--muted); }
.link { display: inline-block; margin-top: 12px; color: var(--accent-text); font-weight: 600; text-decoration: none; }

.foot { margin: 6px 2px 0; max-width: 70ch; color: var(--muted); font-size: 13px; }

/* oefenscherm */
.ex { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 900px) {
  .ex { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); align-items: start; }
  .ex > .prompt { grid-row: span 2; }
  .ex > .controls, .ex > .opts, .ex > .card:not(.prompt):not(.neck):not(.graph) { grid-column: 1 / -1; }
}
.prompt { position: relative; display: grid; gap: 4px; align-content: start; }
.note { margin: 8px 0 0; display: flex; align-items: flex-start; font: 800 semi-condensed clamp(96px, 26vw, 150px)/.8 var(--display); letter-spacing: -.01em; transition: color .15s ease; min-height: .8em; }
.note svg { width: .34em; height: .56em; margin: -.02em 0 0 .03em; fill: currentColor; flex: none; }
.note .deg { font-size: .62em; line-height: 1.05; }
.note .sym { font-size: .42em; line-height: 1.1; margin-left: .04em; align-self: flex-start; }
.where { font: 500 19px/1.35 var(--body); text-wrap: balance; }
.where b { font-weight: 600; color: var(--accent-text); }
.where small { margin-left: 8px; font: 400 13px/1 var(--mono); color: var(--muted); white-space: nowrap; }
.leds { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
.leds span { height: 10px; border-radius: 2px; background: var(--led-off); transition: background-color .06s linear; }
.leds span.on { background: var(--accent); }
.prompt.hit .leds span { background: var(--ok); }
.prompt.hit .note, .prompt.hit .note .deg { color: var(--ok); }
.prompt.miss .note .deg { color: var(--bad); }
.toast { min-height: 1.45em; margin-top: 4px; font: 500 14px/1.45 var(--mono); color: var(--muted); }
.prompt.hit .toast { color: var(--ok); }
.prompt.miss .toast { color: var(--bad); }
.heard-line { display: flex; gap: 8px; align-items: baseline; font: 400 13px/1.4 var(--mono); color: var(--muted); }
.heard-line b { font: 700 semi-condensed 20px/1 var(--display); color: var(--ink); }
.heard-line.big b { font-size: 36px; }
.timer { position: absolute; top: 12px; right: 16px; font: 800 semi-condensed 44px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--ink); }
.timer.low { color: var(--bad); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.step { min-width: 34px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); text-align: center; font: 500 14px/1 var(--mono); color: var(--muted); }
.step.now { border-color: var(--accent); color: var(--accent-text); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.step.done { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.slots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.slot { display: grid; justify-items: center; gap: 2px; min-width: 52px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.slot small { font: 500 11px/1 var(--mono); color: var(--muted); }
.slot b { font: 700 semi-condensed 24px/1 var(--display); }
.slot.now { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.slot.on { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.slot.on small { color: inherit; opacity: .8; }
.scale-line { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.scale-line span { display: grid; justify-items: center; padding: 4px 8px; border-radius: 8px; background: var(--surface-2); font: 600 15px/1.1 var(--body); }
.scale-line span small { font: 400 10px/1 var(--mono); color: var(--muted); }
.scale-line span.on { background: var(--ok); color: var(--ok-ink); }
.scale-line span.on small { color: inherit; }
.progress { height: 8px; border-radius: 4px; background: var(--led-off); margin-top: 12px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .1s linear; }
.prompt.hit .progress span { background: var(--ok); }
.prog-text { font: 400 13px/1.4 var(--mono); color: var(--muted); margin-top: 6px; }

/* hals */
.neck { margin: 0; padding: 10px 8px 6px; }
.neck svg { display: block; width: 100%; height: auto; }
.neck-cap { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 6px 2px; font: 400 12px/1.4 var(--mono); color: var(--muted); }
.neck-legend { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.lg { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-left: 6px; vertical-align: -1px; }
.lg.root { background: var(--muted); }
.lg.next { border: 2px solid var(--accent); }
.lg.done { background: var(--ok); }
.neck .w1 { stop-color: var(--wood); }
.neck .w2 { stop-color: var(--wood-2); }
.neck .grain { fill: none; stroke: var(--wood-2); stroke-width: 1.4; opacity: .55; }
.neck .shade { fill: var(--surface); opacity: .62; }
.neck .fretw { stroke: var(--fret); stroke-width: 4.5; }
.neck .freth { stroke: var(--fret-hi); stroke-width: 1.2; opacity: .8; }
.neck .nut { fill: var(--nut); stroke: var(--line); stroke-width: 1; }
.neck .inlay { fill: var(--inlay); }
.neck .str { stroke: var(--string); stroke-linecap: round; }
.neck .str.wound { stroke: var(--wound); }
.neck .wind { stroke: var(--wound-hi); stroke-dasharray: 1.4 2.4; opacity: .7; }
.neck .glow { stroke: var(--accent); opacity: .32; stroke-linecap: round; }
.neck .str.target { stroke: var(--accent); }
.neck .slbl { font: 500 22px var(--mono); fill: var(--muted); }
.neck .slbl.target { fill: var(--accent-text); font-weight: 600; }
.neck .fnum { font: 400 22px var(--mono); fill: var(--muted); }
.neck .mk circle { stroke-width: 3; }
.neck .mk text { font-family: var(--mono); font-weight: 600; }
.neck .mk.found circle { fill: var(--ok); stroke: var(--surface); }
.neck .mk.found text { fill: var(--ok-ink); }
.neck .mk.hint circle { fill: var(--surface); stroke: var(--accent); stroke-dasharray: 5 4; animation: pulse 1.1s ease-in-out infinite; }
.neck .mk.hint text { fill: var(--accent-text); }
.neck .mk.todo circle { fill: var(--surface); stroke: var(--muted); stroke-width: 2; }
.neck .mk.todo text { fill: var(--ink); }
.neck .mk.todo.root circle { fill: var(--muted); stroke: var(--surface); }
.neck .mk.todo.root text { fill: var(--surface); }
.neck .mk.found.root circle { stroke: var(--ink); stroke-width: 3; }
.neck .mk.hint.root circle { stroke-width: 4; }
.neck .mk.next circle { fill: var(--accent); stroke: var(--surface); stroke-width: 3; animation: pulse 1.1s ease-in-out infinite; }
.neck .mk.next text { fill: var(--accent-ink); }
.neck .mk.heat circle { stroke: var(--surface); stroke-width: 2; }
.neck .mk.heat text { fill: #15171C; font-weight: 500; }
.neck .mk.h0 circle { fill: var(--heat-0); }
.neck .mk.h1 circle { fill: var(--heat-1); } .neck .mk.h2 circle { fill: var(--heat-2); } .neck .mk.h3 circle { fill: var(--heat-3); }
.neck .mk.h4 circle { fill: var(--heat-4); } .neck .mk.h5 circle { fill: var(--heat-5); }
@keyframes pulse { 50% { opacity: .55; } }

/* knoppen */
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button { font: 600 15px/1 var(--body); padding: 13px 16px; border-radius: 10px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button:hover { border-color: var(--muted); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary.stop, button.stop { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.danger { color: var(--bad); }
kbd { margin-left: 8px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; font: 500 11px/1 var(--mono); color: var(--muted); }
@media (hover: none) { kbd { display: none; } }
@media (max-width: 560px) {
  .controls { display: grid; grid-template-columns: minmax(0, 1.2fr) repeat(2, minmax(0, 1fr)); }
  .controls.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .controls button { padding: 15px 8px; min-width: 0; }
  .controls > button:only-child { grid-column: 1 / -1; }
  .controls:has(> button:nth-child(2):last-child) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 561px) { .controls .mic-btn { min-width: 150px; } }

/* opties */
details.opts summary, details.card summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 600 15px/1.2 var(--body); }
details.opts { padding: 14px 16px; }
details.opts summary::-webkit-details-marker { display: none; }
details.opts summary .opt-sum { font: 400 12px/1.2 var(--mono); color: var(--muted); flex: 1; }
details.opts summary::after { content: "+"; font: 500 20px/1 var(--mono); color: var(--muted); }
details.opts[open] summary::after { content: "–"; }
.set-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 28px; padding-top: 14px; }
@media (max-width: 640px) { .set-grid { grid-template-columns: minmax(0, 1fr); } }
.field { display: grid; gap: 8px; align-content: start; min-width: 0; }
.field .lbl { font: 600 13px/1.3 var(--body); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 9px 11px; border-radius: 8px; font: 500 14px/1.1 var(--body); }
.seg.tight button { min-width: 40px; font-family: var(--mono); }
.seg button small { font-size: 11px; color: var(--muted); margin-left: 3px; }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.seg button[aria-pressed="true"] small { color: inherit; opacity: .7; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; }
select { font: 500 15px/1.2 var(--body); padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.settings-view { display: grid; gap: 12px; }
.lvl { display: grid; gap: 6px; }
.lvl-head { display: flex; justify-content: space-between; gap: 8px; font: 400 12px/1.2 var(--mono); color: var(--muted); }
.level { position: relative; height: 8px; border-radius: 4px; background: var(--led-off); }
.lvl-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 4px; background: var(--muted); }
.lvl-fill.loud { background: var(--accent); }
.lvl-gate { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); }

/* scores */
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin: 12px 0 0; }
.fig { margin: 0; min-width: 0; }
.fig dt { font: 500 11px/1.2 var(--mono); color: var(--muted); }
.fig dd { margin: 6px 0 0; font: 700 semi-condensed 30px/1 var(--display); font-variant-numeric: tabular-nums; }
.fig dd small { font: 400 12px/1 var(--mono); color: var(--muted); margin-left: 4px; }
.hard ol { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.hard li { display: flex; justify-content: space-between; gap: 12px; }
.hard li span:last-child { font: 400 13px/1.5 var(--mono); color: var(--muted); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font: 400 12px/1.4 var(--mono); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.hz { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.hz.h0 { background: var(--heat-0); } .hz.h1 { background: var(--heat-1); } .hz.h2 { background: var(--heat-2); }
.hz.h3 { background: var(--heat-3); } .hz.h4 { background: var(--heat-4); } .hz.h5 { background: var(--heat-5); }

/* bends */
.graph { margin: 0; padding: 10px 8px 6px; }
.bend-canvas { display: block; width: 100%; height: 220px; }

/* metronoom */
.metro { justify-items: stretch; }
.bpm-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 6px; }
.bpm { font: 800 semi-condensed 88px/.9 var(--display); text-align: center; font-variant-numeric: tabular-nums; }
.bpm-unit { text-align: center; font: 400 12px/1.4 var(--mono); color: var(--muted); }
.round { width: 56px; height: 56px; border-radius: 50%; padding: 0; font: 500 28px/1 var(--body); display: grid; place-items: center; flex: none; }
.beats { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
.beats span { width: 22px; height: 22px; border-radius: 50%; background: var(--led-off); border: 2px solid transparent; transition: background-color .05s; }
.beats span.acc { border-color: var(--muted); }
.beats span.on { background: var(--accent); }
.last-hit { margin-top: 8px; font: 700 semi-condensed 26px/1.1 var(--display); }
.last-hit.good { color: var(--ok); } .last-hit.near { color: var(--accent-text); } .last-hit.off { color: var(--bad); }
.strip { position: relative; height: 46px; margin-top: 12px; border-radius: 8px; background: var(--surface-2); }
.strip .zone { position: absolute; left: 37.5%; width: 25%; top: 0; bottom: 14px; background: var(--ok-soft); }
.strip .mid { position: absolute; left: 50%; top: 0; bottom: 14px; width: 2px; margin-left: -1px; background: var(--ok); }
.strip i { position: absolute; top: 8px; width: 3px; height: 18px; margin-left: -1.5px; border-radius: 2px; background: var(--muted); opacity: .6; }
.strip i.last { background: var(--accent); opacity: 1; width: 5px; margin-left: -2.5px; top: 4px; height: 26px; }
.strip em { position: absolute; bottom: 0; font: normal 400 10px/1.2 var(--mono); color: var(--muted); }
.strip em.l { left: 6px; } .strip em.r { right: 6px; }

/* stemapparaat */
.meter { position: relative; height: 38px; margin-top: 12px; }
.meter .track { position: absolute; left: 0; right: 0; top: 14px; height: 2px; background: var(--line); }
.meter .zone { position: absolute; left: 45%; width: 10%; top: 9px; height: 12px; border-radius: 3px; background: color-mix(in srgb, var(--ok) 22%, transparent); }
.meter .tick { position: absolute; top: 6px; width: 1px; height: 18px; background: var(--muted); }
.meter .needle { position: absolute; top: 2px; width: 4px; height: 26px; margin-left: -2px; border-radius: 2px; background: var(--accent); transition: left .08s linear; }
.meter .needle.ok { background: var(--ok); }
.meter .scale { position: absolute; left: 0; right: 0; top: 26px; display: flex; justify-content: space-between; font: 400 11px/1 var(--mono); color: var(--muted); }
.str-btns { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.str-btns button { display: grid; justify-items: center; gap: 4px; padding: 12px 4px; font: 700 semi-condensed 20px/1 var(--display); }
.str-btns button small { font: 400 11px/1 var(--mono); color: var(--muted); }
.str-btns button.near { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.str-btns button.ok { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.str-btns button.ok small { color: inherit; }

@media (max-width: 560px) {
  .card { padding: 14px; }
  .note { font-size: 104px; margin-top: 6px; }
  .where { font-size: 17px; }
  .neck { padding: 8px 6px 4px; }
  .bpm { font-size: 76px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ===================== Leer-app: bovenbalk, tabbalk, leerpad, lessen, voortgang ===================== */
:root { --cal-0: #E2E5EA; --cal-1: #F8E3BE; --cal-2: #F0C373; --cal-3: #E39B22; --cal-4: #A86400; --shade-node: #B8740A; --shade-ok: #136B39; --shade-off: #C9CED6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cal-0: #2F2824; --cal-1: #4A3518; --cal-2: #7D561A; --cal-3: #C4841C; --cal-4: #F4B65A; --shade-node: #A8600E; --shade-ok: #1F7A48; --shade-off: #3A322C; } }
:root[data-theme="dark"] { --cal-0: #2F2824; --cal-1: #4A3518; --cal-2: #7D561A; --cal-3: #C4841C; --cal-4: #F4B65A; --shade-node: #A8600E; --shade-ok: #1F7A48; --shade-off: #3A322C; }

.ico { width: 22px; height: 22px; display: block; }
.top { gap: 8px; min-height: 48px; }
.brand h1 { font-size: 30px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px 6px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: 600 14px/1 var(--mono); text-decoration: none; flex: none; }
.chip .ico { width: 18px; height: 18px; }
.chip.streak.lit { color: var(--accent-text); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.chip.streak.lit .ico { color: var(--accent); }
.chip.goal .ring-bg { fill: none; stroke: var(--led-off); stroke-width: 3.5; }
.chip.goal .ring-fg { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; transition: stroke-dasharray .4s; }
.chip.goal.lit { color: var(--ok); }
.chip.goal.lit .ring-fg { stroke: var(--ok); }
.micbtn { width: 40px; height: 40px; border-radius: 50%; padding: 0; display: grid; place-items: center; flex: none; color: var(--muted); }
.micbtn .ico { width: 20px; height: 20px; }
.micbtn[data-state="on"] { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.micbtn[data-state="busy"] { border-color: var(--accent); color: var(--accent-text); }
body[data-view="mode"] .chip, body[data-view="settings"] .chip { display: none; }
body[data-view="lesson"] .top, body[data-view="lesson"] #sessionBar { display: none !important; }
@media (max-width: 380px) { .chip { padding: 6px 8px 6px 6px; font-size: 13px; } .brand h1 { font-size: 24px; } }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabbar a { display: grid; justify-items: center; gap: 3px; padding: 7px 0 6px; text-decoration: none; color: var(--muted); font: 600 12px/1.1 var(--body); border-radius: 12px; }
.tabbar a .ico { width: 24px; height: 24px; }
.tabbar a[aria-current="page"] { color: var(--accent-text); background: var(--accent-soft); }
body[data-view="mode"] .tabbar, body[data-view="lesson"] .tabbar, body[data-view="settings"] .tabbar { display: none; }
body[data-view="path"], body[data-view="practice"], body[data-view="progress"] { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
body[data-view="path"] { padding-bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) { .tabbar { left: 50%; right: auto; transform: translateX(-50%); width: 480px; bottom: 12px; border: 1px solid var(--line); border-radius: 18px; } }

#sessionBar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent); font-size: 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; }
#sessionBar .sb-dots { display: inline-flex; gap: 4px; }
#sessionBar .sb-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--led-off); }
#sessionBar .sb-dots i.done { background: var(--ok); }
#sessionBar .sb-dots i.now { background: var(--accent); }
#sessionBar .sb-txt { flex: 1; min-width: 0; }
#sessionBar .sb-time { font: 600 16px/1 var(--mono); font-variant-numeric: tabular-nums; }
#sessionBar button { padding: 8px 12px; font-size: 13px; border-radius: 8px; }

.flash { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 60; display: flex; gap: 12px; align-items: center; padding: 12px 18px 12px 14px; border-radius: 14px; background: var(--ink); color: var(--bg); box-shadow: 0 8px 24px rgba(0, 0, 0, .25); width: max-content; max-width: calc(100% - 32px); text-align: left; animation: flash-in .3s ease-out; transition: opacity .4s, transform .4s; }
body[data-view="lesson"] .flash { top: calc(68px + env(safe-area-inset-top, 0px)); }
.flash .fl-ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); flex: none; }
.flash .ico { width: 20px; height: 20px; }
.flash .fl-txt { display: grid; gap: 1px; min-width: 0; }
.flash b { font-size: 15px; line-height: 1.25; }
.flash small { font-size: 13px; line-height: 1.3; opacity: .75; }
.flash.out { opacity: 0; transform: translate(-50%, -10px); }
@keyframes flash-in { from { opacity: 0; transform: translate(-50%, -10px); } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; transition: none; } }
.end-badges { display: grid; gap: 8px; width: 100%; max-width: 420px; }
.end-badge { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; border: 2px solid color-mix(in srgb, var(--accent) 50%, var(--line)); background: var(--accent-soft); text-align: left; }
.end-badge .b-ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--accent); flex: none; }
.end-badge .ico { width: 22px; height: 22px; }
.end-badge div { display: grid; gap: 1px; min-width: 0; }
.end-badge small { font: 500 11px/1.3 var(--mono); color: var(--accent-text); }
.end-badge b { font-size: 15px; line-height: 1.25; }
.end-badge span:last-child { font-size: 13px; color: var(--muted); line-height: 1.3; }

/* leerpad */
.path { display: grid; gap: 6px; }
.unit { display: grid; }
.unit-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 14px 16px 16px; border-radius: 18px; background: var(--c, var(--accent)); color: var(--c-ink, var(--accent-ink)); box-shadow: 0 4px 0 var(--c-deep, var(--accent-deep)); }
.unit-head .eyebrow { color: inherit; opacity: .75; }
.unit-head h2 { margin: 3px 0 3px; font: 800 semi-condensed 28px/1.02 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.uh-sub { margin: 0; font-size: 14px; opacity: .85; }
.uh-text { min-width: 0; }
.uh-side { display: grid; justify-items: end; gap: 8px; flex: none; }
.uh-count { font: 700 14px/1 var(--body); }
.uh-link { font: 600 13px/1 var(--body); color: inherit; text-decoration: none; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--c-ink, var(--accent-ink)) 14%, transparent); white-space: nowrap; }
.uh-lock .ico { width: 22px; height: 22px; }
.unit.locked .unit-head { background: var(--surface); color: var(--muted); border: 2px dashed var(--line); box-shadow: none; }
.unit .track { position: relative; display: grid; justify-items: center; gap: 16px; padding: 62px 0 30px; }
.node-row:has(.bubble):not(:first-child) { margin-top: 40px; }
.node-row { position: relative; transform: translateX(calc(var(--x) * 56px)); }
.node { position: relative; width: 72px; height: 72px; border-radius: 50%; padding: 0; display: grid; place-items: center; border: 0; background: var(--c, var(--accent)); color: var(--c-ink, var(--accent-ink)); box-shadow: 0 6px 0 var(--c-deep, var(--accent-deep)); transition: transform .08s; }
.node:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--c-deep, var(--accent-deep)); }
.node .ico { width: 30px; height: 30px; }
.node.done { background: var(--c, var(--accent)); color: var(--c-ink, var(--accent-ink)); }
.node.locked { background: var(--led-off); color: var(--muted); box-shadow: 0 6px 0 var(--shade-off); }
.node.open:not(.next) { background: var(--surface); color: var(--c-text, var(--accent-text)); box-shadow: 0 6px 0 var(--shade-off); border: 3px solid var(--c, var(--accent)); }
.node.test { border-radius: 24px; }
.node.next { outline: 5px solid color-mix(in srgb, var(--c, var(--accent)) 35%, transparent); outline-offset: 5px; }
.bubble { position: absolute; bottom: calc(100% + 16px); left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 9px 13px; border-radius: 12px; background: var(--surface); color: var(--c-text, var(--accent-text)); border: 2px solid var(--line); font: 700 14px/1 var(--body); box-shadow: 0 3px 0 var(--line); animation: bob 1.8s ease-in-out infinite; z-index: 2; }

.path-end { text-align: center; color: var(--muted); font-size: 13px; padding: 4px 20px 0; }
.note-bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; }

.cta-bar { position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); padding: 12px 16px 10px; background: linear-gradient(to top, var(--bg) 72%, transparent); z-index: 15; }

/* sheets */

/* les */

.ls-bar { flex: 1; height: 14px; border-radius: 7px; background: var(--led-off); overflow: hidden; }
.ls-bar span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 7px; transition: width .3s ease; }
.ls-count { font: 500 13px/1 var(--mono); color: var(--muted); min-width: 36px; text-align: right; }
.ls-body { display: grid; gap: 12px; align-content: start; min-width: 0; }

.ls-prompt { margin: 0; font: 800 semi-condensed 27px/1.14 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.ls-sub { margin: 0; color: var(--muted); font-size: 15px; }

.ls-opts.grid .opt { text-align: center; font: 700 semi-condensed 28px/1 var(--display); padding: 18px 8px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 3px 0 var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); box-shadow: 0 3px 0 var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); }

.ls-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { min-width: 58px; padding: 12px 12px; font: 700 semi-condensed 22px/1 var(--display); border-width: 2px; border-radius: 12px; box-shadow: 0 3px 0 var(--line); }
.chip-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 3px 0 var(--accent); }
.chip-btn.right { border-color: var(--ok); background: var(--ok-soft); }
.chip-btn.wrong { border-color: var(--bad); background: var(--bad-soft); }
.chip-btn:disabled { opacity: 1; }
.tapneck { margin: 0; }
.neck .cell { fill: transparent; cursor: pointer; }
.neck .mk.sel circle { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 4; }
.neck .mk.wrong circle { fill: var(--bad); stroke: var(--surface); }
.ls-big { margin: 4px 0 0; }
.ls-hint { color: var(--accent-text); font: 500 14px/1.45 var(--mono); }
.ls-hint:empty { display: none; }
.ls-foot { position: sticky; bottom: 0; display: grid; gap: 10px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); margin-inline: -16px; background: var(--bg); border-top: 1px solid var(--line); z-index: 4; }
.ls-foot.ok { background: var(--ok-soft); border-color: var(--ok); }
.ls-foot.bad { background: var(--bad-soft); border-color: var(--bad); }

.ls-foot.bad button.primary { background: var(--bad); border-color: var(--bad); color: #FFFFFF; box-shadow: none; }
.fb { display: flex; gap: 12px; align-items: flex-start; }
.fb b { font: 700 20px/1.2 var(--body); }
.fb p { margin: 4px 0 0; font-size: 15px; line-height: 1.45; }
.fb-fret { width: 54px; height: 54px; flex: none; margin-top: -4px; }

.ls-foot.bad .fb b { color: var(--bad); }
.ls-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }

.linkish { background: none; border: 0; color: var(--muted); font: 500 14px/1.2 var(--body); text-decoration: underline; padding: 4px; justify-self: center; }
.ls-end { display: grid; justify-items: center; text-align: center; gap: 12px; padding-top: 24px; }

.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }

.cal-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.cal-legend i.l0 { background: var(--cal-0); } .cal-legend i.l1 { background: var(--cal-1); } .cal-legend i.l2 { background: var(--cal-2); } .cal-legend i.l3 { background: var(--cal-3); } .cal-legend i.l4 { background: var(--cal-4); }
.chart-info { margin: 8px 0 0; font: 500 13px/1.4 var(--mono); color: var(--ink); min-height: 1.4em; }
.week-wrap svg { width: 100%; height: auto; max-width: 560px; display: block; margin-top: 8px; }
.week .grid { stroke: var(--line); stroke-width: 1; }
.week .tick { font: 400 10px var(--mono); fill: var(--muted); }
.week .tick.now { fill: var(--ink); font-weight: 600; }
.week .bar { fill: var(--accent); }

.unit-list { display: grid; gap: 14px; margin-top: 12px; }

.badges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
@media (min-width: 640px) { .badges { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.badge { display: grid; justify-items: center; align-content: start; text-align: center; gap: 4px; padding: 12px 6px; border-radius: 12px; border: 1px solid var(--line); color: var(--muted); }
.badge .b-ico { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--led-off); opacity: .7; }
.badge .ico { width: 24px; height: 24px; }
.badge.got { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.badge.got .b-ico { background: var(--accent-soft); color: var(--accent); opacity: 1; }

.row.links { margin-top: 6px; gap: 4px 18px; }


/* ===================== Huisstijl: fret, pedalen, foutenbak, animaties ===================== */
body { font-variant-numeric: tabular-nums; }
.c-amber { --c: var(--accent); --c-ink: var(--accent-ink); --c-deep: var(--accent-deep); --c-soft: var(--accent-soft); --c-text: var(--accent-text); }
.c-blauw { --c: #2D6BD4; --c-ink: #FFFFFF; --c-deep: #1D4C9E; --c-soft: #DCE8FB; --c-text: #2257B5; }
.c-framboos { --c: #C4336F; --c-ink: #FFFFFF; --c-deep: #8E1F4D; --c-soft: #F8DDE8; --c-text: #A82A5E; }
.c-violet { --c: #7146D4; --c-ink: #FFFFFF; --c-deep: #4F2E9E; --c-soft: #E7DFFA; --c-text: #5E37BE; }
.c-groen { --c: #0B7D72; --c-ink: #FFFFFF; --c-deep: #055A52; --c-soft: #D5F0EC; --c-text: #08695F; }
.c-tabak { --c: #B4520E; --c-ink: #FFFFFF; --c-deep: #7E3707; --c-soft: #F8E2D2; --c-text: #96440A; }
.c-leisteen { --c: #566170; --c-ink: #FFFFFF; --c-deep: #3A434F; --c-soft: #E3E7EC; --c-text: #48525F; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .c-blauw { --c-soft: #1B2A44; --c-text: #8DB4F5; }
  :root:not([data-theme="light"]) .c-framboos { --c-soft: #3A1726; --c-text: #F08DB5; }
  :root:not([data-theme="light"]) .c-violet { --c-soft: #2A1F45; --c-text: #B9A2F5; }
  :root:not([data-theme="light"]) .c-groen { --c-soft: #0F2E2B; --c-text: #6CD6C8; }
  :root:not([data-theme="light"]) .c-tabak { --c-soft: #3A2414; --c-text: #F2A56B; }
  :root:not([data-theme="light"]) .c-leisteen { --c-soft: #262B33; --c-text: #AEB8C6; }
}

/* kop met de fret als logo */
.logo { width: 40px; height: 40px; flex: none; margin-right: -2px; }
.logo svg { width: 100%; height: 100%; display: block; }
.chip { font: 700 14px/1 var(--body); }
.tabbar a[aria-current="page"] .ico { animation: pop .38s cubic-bezier(.3, 1.6, .5, 1); }
#view.enter { animation: view-in .2s ease-out; }
@keyframes view-in { from { opacity: 0; } }

/* labels zonder hoofdletters */
.fig dt, .tile-l, .end-stats small, .end-badge small { font: 600 12.5px/1.25 var(--body); color: var(--muted); }
.end-badge small { color: var(--accent-text); }
.tile-v { font: 800 semi-condensed 34px/1 var(--display); }
.fig dd { font-weight: 800; }
.card-h { margin: 0 0 4px; font: 800 semi-condensed 22px/1.15 var(--display); letter-spacing: -.01em; }
.hub-h { margin: 0 2px; font: 800 semi-condensed 22px/1.1 var(--display); letter-spacing: -.01em; }

/* leerpad */
.uh-eyebrow { margin: 0; font: 700 13px/1.2 var(--body); opacity: .85; }
.uh-prog { height: 8px; max-width: 220px; margin-top: 12px; border-radius: 4px; overflow: hidden; background: color-mix(in srgb, var(--c-ink, #000) 18%, transparent); }
.uh-prog span { display: block; height: 100%; border-radius: 4px; background: var(--c-ink); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.uh-done { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--c-ink); color: var(--c); }
.uh-done .ico { width: 18px; height: 18px; stroke-width: 3; }
.side-fret { position: absolute; left: calc(50% - 178px); top: 132px; width: 120px; pointer-events: none; }
.side-fret svg { width: 100%; height: auto; display: block; }
@media (max-width: 360px) { .side-fret { width: 100px; left: calc(50% - 158px); } }
.empty-fret { width: 120px; margin: 0 auto 6px; }
.empty-fret svg { width: 100%; height: auto; display: block; }
.path.intro .unit-head { animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
.path.intro .node { animation: node-in .42s cubic-bezier(.3, 1.5, .5, 1) both; animation-delay: var(--d, 0ms); }
.path.intro .bubble { animation: bubble-in .35s .45s cubic-bezier(.3, 1.5, .5, 1) both, bob 1.8s 1s ease-in-out infinite; }
.path.intro .side-fret { animation: fret-peek .6s .3s cubic-bezier(.3, 1.4, .5, 1) both; }
.node.just-done { animation: stamp .62s .15s cubic-bezier(.3, 1.6, .5, 1) both; }
.node.just-done::after { content: ""; position: absolute; inset: -4px; border-radius: inherit; border: 4px solid var(--c, var(--accent)); opacity: 0; animation: ring-out .75s .3s ease-out; pointer-events: none; }
.node.just-done .ico path { stroke-dasharray: 26; stroke-dashoffset: 26; animation: draw .35s .5s ease-out forwards; }
.node.just-next { animation: node-in .45s .85s cubic-bezier(.3, 1.5, .5, 1) both; }
.node-row:has(.just-next) .bubble { animation: bubble-in .35s 1.1s cubic-bezier(.3, 1.5, .5, 1) both, bob 1.8s 1.6s ease-in-out infinite; }
@keyframes node-in { from { transform: scale(.4); opacity: 0; } }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } }
@keyframes fret-peek { from { transform: translateX(-26px) rotate(-8deg); opacity: 0; } }
@keyframes bubble-in { from { transform: translate(-50%, 8px) scale(.7); opacity: 0; } }
@keyframes stamp { 0% { transform: scale(.7); } 55% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes ring-out { from { transform: scale(.85); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* knop voor de foutenbak naast "Oefen vandaag" */
.bin-btn { position: relative; flex: none; width: 70px; padding: 8px 4px; display: grid; justify-items: center; align-content: center; gap: 3px; border-radius: 14px; border: 2px solid color-mix(in srgb, var(--bad) 45%, var(--line)); background: var(--surface); color: var(--bad); box-shadow: 0 4px 0 color-mix(in srgb, var(--bad) 35%, var(--line)); }
.bin-btn .ico { width: 26px; height: 26px; }
.bin-btn small { font: 700 11.5px/1 var(--body); color: var(--muted); }
.bin-btn b { position: absolute; top: -9px; right: -7px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--bad); color: #FFFFFF; font: 700 13px/24px var(--body); border: 2px solid var(--bg); }
.bin-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--bad) 35%, var(--line)); }

/* les */
.lesson { position: relative; }
.ls-top { gap: 10px; }
.ls-snd { width: 40px; height: 40px; border-radius: 50%; padding: 0; display: grid; place-items: center; flex: none; color: var(--muted); }
.ls-snd .ico { width: 20px; height: 20px; }
.ls-bin { display: inline-flex; align-items: center; gap: 3px; color: var(--bad); font: 800 16px/1 var(--body); }
.ls-bin .ico { width: 22px; height: 22px; }
.ls-bin.pop { animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }
.ls-count { font: 600 13px/1 var(--body); }
.combo { position: absolute; top: 60px; right: 0; z-index: 6; display: flex; align-items: center; gap: 6px; padding: 8px 14px 8px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 800 semi-condensed 17px/1 var(--display); box-shadow: 0 4px 0 var(--accent-deep); opacity: 0; transform: translateY(-8px) scale(.8); transform-origin: right center; pointer-events: none; transition: opacity .2s, transform .3s cubic-bezier(.3, 1.6, .5, 1); }
.combo.show { opacity: 1; transform: none; }
.combo .ico { width: 18px; height: 18px; }
.ls-body.enter > * { animation: q-in .3s cubic-bezier(.2, .8, .2, 1) both; }
.ls-body.enter > :nth-child(2) { animation-delay: .03s; }
.ls-body.enter > :nth-child(3) { animation-delay: .06s; }
.ls-body.enter > :nth-child(n+4) { animation-delay: .09s; }
@keyframes q-in { from { opacity: 0; transform: translateX(22px); } }
.shake { animation: shake .42s cubic-bezier(.36, .07, .19, .97); }
@keyframes shake { 15% { transform: translateX(-8px); } 35% { transform: translateX(7px); } 55% { transform: translateX(-5px); } 75% { transform: translateX(3px); } }
.pop { animation: pop .38s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 45% { transform: scale(1.07); } }
.ls-foot.ok, .ls-foot.bad { animation: foot-up .26s cubic-bezier(.2, .8, .2, 1); }
@keyframes foot-up { from { transform: translateY(28px); opacity: .3; } }
.ls-foot.ok .fb-fret { animation: hop-small .5s .05s cubic-bezier(.3, 1.6, .5, 1); }
.ls-foot.bad .fb-fret { animation: tilt .5s .05s ease-out; }
@keyframes hop-small { 40% { transform: translateY(-8px) rotate(-6deg); } }
@keyframes tilt { 30% { transform: rotate(-9deg); } 60% { transform: rotate(5deg); } }
.fb b { font: 800 semi-condensed 23px/1.1 var(--display); }
.fb p.fb-note { display: flex; align-items: center; gap: 6px; margin-top: 8px; font: 600 13.5px/1.35 var(--body); color: var(--bad); }
.ls-foot.ok p.fb-note { color: var(--ok); }
.fb-note .ico { width: 18px; height: 18px; flex: none; }
.end-fret { width: 156px; height: 156px; }
.end-fret svg { width: 100%; height: 100%; display: block; }
.end-fret { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }

<script>
(() => {
'use strict';
// ---------- Muziektheorie ----------
const OPEN = [64, 59, 55, 50, 45, 40];              // snaar 1 (hoge E) t/m 6 (lage E), MIDI
const STR_LETTER = ['e', 'B', 'G', 'D', 'A', 'E'];
const STR_NAME = ['hoge E-snaar', 'B-snaar', 'G-snaar', 'D-snaar', 'A-snaar', 'lage E-snaar'];
const GAUGE = [10, 13, 17, 26, 36, 46];
const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
const SHARP_NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const FLAT_NAMES = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];
const NATURAL = new Set([0, 2, 4, 5, 7, 9, 11]);
const ACC_SYM = { '-2': '𝄫', '-1': '♭', '0': '', '1': '♯', '2': '𝄪' };
const MAX_FRET = 19;

const mod12 = n => ((n % 12) + 12) % 12;
const octaveOf = midi => Math.floor(midi / 12) - 1;
const m2f = m => 440 * Math.pow(2, (m - 69) / 12);

function pcName(pc, pref) {
  pc = mod12(pc);
  if (NATURAL.has(pc) || pref === 'sharps' || !pref) return SHARP_NAMES[pc];
  if (pref === 'flats') return FLAT_NAMES[pc];
  return Math.random() < 0.5 ? SHARP_NAMES[pc] : FLAT_NAMES[pc];
}
const pcLabel = (pc, pref) => {
  pc = mod12(pc);
  if (NATURAL.has(pc)) return SHARP_NAMES[pc];
  return pref === 'flats' ? FLAT_NAMES[pc] : pref === 'both' ? `${SHARP_NAMES[pc]}/${FLAT_NAMES[pc]}` : SHARP_NAMES[pc];
};

// Gespelde noot: {li: letterindex 0..6, acc: -2..2}
const spPc = sp => mod12(LETTER_PC[sp.li] + sp.acc);
const spName = sp => LETTERS[sp.li] + (ACC_SYM[sp.acc] ?? '');
function parseName(name) {
  const li = LETTERS.indexOf(name[0]);
  const a = name.slice(1);
  const acc = a === '♯' ? 1 : a === '♭' ? -1 : a === '𝄪' ? 2 : a === '𝄫' ? -2 : 0;
  return { li, acc };
}
function spellFrom(root, steps, semis) {
  const li = (((root.li + steps) % 7) + 7) % 7;
  const target = mod12(spPc(root) + semis);
  let acc = target - LETTER_PC[li];
  acc = mod12(acc + 6) - 6;
  return { li, acc };
}
// eenvoudige spelling: hooguit één ♯/♭ en geen E♯, B♯, F♭, C♭
const isSimple = sp => Math.abs(sp.acc) <= 1 && !(sp.acc === 1 && (sp.li === 2 || sp.li === 6)) && !(sp.acc === -1 && (sp.li === 3 || sp.li === 0));

const DG = (steps, semis, label) => ({ steps, semis, label });

const SCALES = {
  minpent: { name: 'Mineur pentatonisch', short: 'mineur pentatonisch', degs: [DG(0, 0, 'R'), DG(2, 3, '♭3'), DG(3, 5, '4'), DG(4, 7, '5'), DG(6, 10, '♭7')], perString: 2, minorish: true },
  majpent: { name: 'Majeur pentatonisch', short: 'majeur pentatonisch', degs: [DG(0, 0, 'R'), DG(1, 2, '2'), DG(2, 4, '3'), DG(4, 7, '5'), DG(5, 9, '6')], perString: 2 },
  blues: { name: 'Blues', short: 'blues', degs: [DG(0, 0, 'R'), DG(2, 3, '♭3'), DG(3, 5, '4'), DG(4, 6, '♭5'), DG(4, 7, '5'), DG(6, 10, '♭7')], base: 'minpent', minorish: true },
  major: { name: 'Majeur (ionisch)', short: 'majeur', degs: [DG(0, 0, 'R'), DG(1, 2, '2'), DG(2, 4, '3'), DG(3, 5, '4'), DG(4, 7, '5'), DG(5, 9, '6'), DG(6, 11, '7')], perString: 3 },
  minor: { name: 'Mineur (eolisch)', short: 'mineur', degs: [DG(0, 0, 'R'), DG(1, 2, '2'), DG(2, 3, '♭3'), DG(3, 5, '4'), DG(4, 7, '5'), DG(5, 8, '♭6'), DG(6, 10, '♭7')], perString: 3, minorish: true },
  dorian: { name: 'Dorisch', short: 'dorisch', degs: [DG(0, 0, 'R'), DG(1, 2, '2'), DG(2, 3, '♭3'), DG(3, 5, '4'), DG(4, 7, '5'), DG(5, 9, '6'), DG(6, 10, '♭7')], perString: 3, minorish: true },
  mixo: { name: 'Mixolydisch', short: 'mixolydisch', degs: [DG(0, 0, 'R'), DG(1, 2, '2'), DG(2, 4, '3'), DG(3, 5, '4'), DG(4, 7, '5'), DG(5, 9, '6'), DG(6, 10, '♭7')], perString: 3 },
};
const MINOR_ROOTS = ['A', 'E', 'B', 'F♯', 'C♯', 'G♯', 'D', 'G', 'C', 'F', 'B♭', 'E♭'];
const MAJOR_ROOTS = ['C', 'G', 'D', 'A', 'E', 'B', 'F♯', 'F', 'B♭', 'E♭', 'A♭', 'D♭'];
const rootsFor = scaleId => (SCALES[scaleId].minorish ? MINOR_ROOTS : MAJOR_ROOTS);

function scaleTones(scaleId, rootName) {
  const root = parseName(rootName);
  return SCALES[scaleId].degs.map(d => {
    const sp = spellFrom(root, d.steps, d.semis);
    return { pc: spPc(sp), name: spName(sp), label: d.label, semis: d.semis };
  });
}

// Box/positie: opeenvolgende toonladdertonen, 2 (pentatonisch) of 3 (diatonisch) per snaar,
// beginnend op de lage E bij de (box-1)e toon boven de grondtoon.
function scaleBox(scaleId, rootName, box) {
  const sc = SCALES[scaleId];
  const baseId = sc.base || scaleId;
  const base = SCALES[baseId];
  const tones = scaleTones(baseId, rootName);
  const n = tones.length;
  const rootPc = tones[0].pc;
  const rf = mod12(rootPc - 4);                       // grondtoon op de lage E (open E = pc 4)
  let k = (box - 1) % n;
  let midi = OPEN[5] + rf + base.degs[k].semis;
  if (midi - OPEN[5] > 12) midi -= 12;
  const pos = [];
  for (let s = 5; s >= 0; s--) {
    for (let j = 0; j < base.perString; j++) {
      const t = tones[k];
      pos.push({ s, f: midi - OPEN[s], midi, pc: t.pc, name: t.name, label: t.label });
      const cur = base.degs[k].semis;
      k = (k + 1) % n;
      const next = base.degs[k].semis;
      midi += mod12(next - cur) || 12;
    }
  }
  if (pos.some(p => p.f < 0)) for (const p of pos) { p.midi += 12; p.f += 12; }   // past niet in open positie: octaaf hoger
  if (sc.base) {
    // blues: voeg de ♭5 toe binnen het bereik van de box
    const all = scaleTones(scaleId, rootName);
    const extra = all.filter(t => !tones.some(b => b.pc === t.pc));
    const lo = Math.min(...pos.map(p => p.f)), hi = Math.max(...pos.map(p => p.f));
    for (const t of extra) {
      for (let s = 0; s < 6; s++) {
        for (let f = lo; f <= hi; f++) {
          if (mod12(OPEN[s] + f) === t.pc) pos.push({ s, f, midi: OPEN[s] + f, pc: t.pc, name: t.name, label: t.label });
        }
      }
    }
  }
  pos.sort((a, b) => a.midi - b.midi || b.s - a.s);
  // dubbele toonhoogtes (zelfde noot op twee snaren) houden we maar één keer: de eerste
  const out = [];
  for (const p of pos) if (!out.some(q => q.midi === p.midi)) out.push(p);
  return out;
}
const boxCount = scaleId => SCALES[SCALES[scaleId].base || scaleId].degs.length;

const CHORDS = {
  maj: { sym: '', name: 'majeur', tones: [DG(0, 0, 'R'), DG(2, 4, '3'), DG(4, 7, '5')] },
  min: { sym: 'm', name: 'mineur', tones: [DG(0, 0, 'R'), DG(2, 3, '♭3'), DG(4, 7, '5')] },
  dom7: { sym: '7', name: 'dominant 7', tones: [DG(0, 0, 'R'), DG(2, 4, '3'), DG(4, 7, '5'), DG(6, 10, '♭7')] },
  maj7: { sym: 'maj7', name: 'groot 7', tones: [DG(0, 0, 'R'), DG(2, 4, '3'), DG(4, 7, '5'), DG(6, 11, '7')] },
  m7: { sym: 'm7', name: 'mineur 7', tones: [DG(0, 0, 'R'), DG(2, 3, '♭3'), DG(4, 7, '5'), DG(6, 10, '♭7')] },
  m7b5: { sym: 'm7♭5', name: 'half-verminderd', tones: [DG(0, 0, 'R'), DG(2, 3, '♭3'), DG(4, 6, '♭5'), DG(6, 10, '♭7')] },
  dim: { sym: '°', name: 'verminderd', tones: [DG(0, 0, 'R'), DG(2, 3, '♭3'), DG(4, 6, '♭5')] },
  sus4: { sym: 'sus4', name: 'sus4', tones: [DG(0, 0, 'R'), DG(3, 5, '4'), DG(4, 7, '5')] },
};
const CHORD_ROOTS = ['C', 'C♯', 'D♭', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
function chordTones(type, rootName) {
  const root = parseName(rootName);
  return CHORDS[type].tones.map(d => {
    const sp = spellFrom(root, d.steps, d.semis);

// ---------- Toonhoogte (McLeod Pitch Method) ----------
function createDetector(N, sr, minF, maxF) {
  const maxTau = Math.min(Math.floor(sr / minF) + 2, N - 2);
  const minTau = Math.max(2, Math.floor(sr / maxF));
  const nsdf = new Float32Array(maxTau + 2);
  const x = new Float32Array(N), sq = new Float32Array(N);
  return function detect(buf) {
    let mean = 0;
    for (let i = 0; i < N; i++) mean += buf[i];
    mean /= N;
    let energy = 0;
    for (let i = 0; i < N; i++) { const v = buf[i] - mean; x[i] = v; sq[i] = v * v; energy += sq[i]; }
    const rms = Math.sqrt(energy / N);
    if (energy <= 1e-12) return { freq: 0, clarity: 0, rms };
    let m = 2 * energy;
    for (let tau = 0; tau <= maxTau + 1; tau++) {
      if (tau > 0) m -= sq[tau - 1] + sq[N - tau];
      let r = 0;
      const lim = N - tau;
      for (let j = 0; j < lim; j++) r += x[j] * x[j + tau];
      nsdf[tau] = m > 1e-12 ? (2 * r) / m : 0;
    }
    let tau = 1;
    while (tau <= maxTau && nsdf[tau] > 0) tau++;
    const peaks = [];
    let best = -1, bestV = -Infinity;
    for (; tau <= maxTau; tau++) {
      const v = nsdf[tau];
      if (v > 0) { if (v > bestV) { bestV = v; best = tau; } }
      else if (best >= 0) { peaks.push(best); best = -1; bestV = -Infinity; }
    }
    if (best >= 0 && best < maxTau) peaks.push(best);
    let highest = 0;
    for (const p of peaks) if (p >= minTau && nsdf[p] > highest) highest = nsdf[p];
    if (highest <= 0) return { freq: 0, clarity: 0, rms };
    const thr = 0.9 * highest;
    let t = -1;
    for (const p of peaks) if (p >= minTau && nsdf[p] >= thr) { t = p; break; }
    const a = nsdf[t - 1], b = nsdf[t], c = nsdf[t + 1];
    const den = a - 2 * b + c;
    const shift = den !== 0 ? (0.5 * (a - c)) / den : 0;
    return { freq: sr / (t + shift), clarity: b - 0.25 * (a - c) * shift, rms };
  };
}

const NOTE_MIN_MS = 100;

// ---------- Gitaarklank (Karplus-Strong) ----------
function ksSamples(sr, midi, dur) {
  const n = Math.floor(sr * dur), y = new Float32Array(n);

  for (let i = 0; i < L; i++) { const w = Math.random() * 2 - 1; prev = prev * 0.45 + w * 0.55; y[i] = prev; }

  for (let i = L; i < n; i++) {
    const d = i - P, i0 = Math.floor(d), fr = d - i0;
    const a = y[i0] * (1 - fr) + y[i0 + 1] * fr;
    const b = y[i0 - 1] * (1 - fr) + y[i0] * fr;
    y[i] = loss * 0.5 * (a + b);
  }
  let mx = 0;
  for (let i = 0; i < n; i++) mx = Math.max(mx, Math.abs(y[i]));
  if (mx > 0) for (let i = 0; i < n; i++) y[i] *= 0.9 / mx;
  return y;
}

  }

    const x = xOf(f).toFixed(1);
    h += `<line class="fretw" x1="${x}" y1="${TOP}" x2="${x}" y2="${yB}"/><line class="freth" x1="${x - 1}" y1="${TOP}" x2="${x - 1}" y2="${yB}"/>`;
  }

  else h += `<line class="fretw" x1="${X0}" y1="${TOP}" x2="${X0}" y2="${yB}"/>`;
  for (let s = 0; s < 6; s++) {

    if (isT) h += `<line class="glow" x1="${strStart}" y1="${y}" x2="${W}" y2="${y}" stroke-width="${(w + 10).toFixed(1)}"/>`;
    h += `<line class="str${wound ? ' wound' : ''}${isT ? ' target' : ''}" x1="${strStart}" y1="${y}" x2="${W}" y2="${y}" stroke-width="${w.toFixed(1)}"/>`;
    if (wound) h += `<line class="wind" x1="${strStart}" y1="${y}" x2="${W}" y2="${y}" stroke-width="${(w * 0.55).toFixed(1)}"/>`;
    h += `<text class="slbl${isT ? ' target' : ''}" x="16" y="${y + 7}" text-anchor="middle">${STR_LETTER[s]}</text>`;

  }

function setLeds(card, v, n) {
  const leds = $$('.pr-leds span', card);

let current = null;
const TABS = { '': 'path', 'leerpad': 'path', 'oefenen': 'practice', 'voortgang': 'progress' };
const Router = {
  render() {
    const hash = location.hash.replace('#', '');
    if (TempSettings.saved && hash !== 'm-' + TempSettings.saved.mode && !Daily.active) TempSettings.restore();
    if (current && current.unmount) current.unmount();
    Engine.sink = null; current = null; UI.tuner = null;
    $$('.sheet-wrap').forEach(x => x.remove());
    const view = $('#view');
    view.innerHTML = '';
    UI.lastHeard = '';
    const back = $('#backBtn');
    let tab = null, title = '';
    if (hash.startsWith('m-') && MODES[hash.slice(2)]) {
      const m = MODES[hash.slice(2)];
      title = m.title; document.body.dataset.view = 'mode';
      current = m; Engine.sink = m;
      m.mount(view);
    } else if (hash === 'les') {
      document.body.dataset.view = 'lesson';
      current = Lesson; Engine.sink = Lesson;
      Lesson.mount(view);
    } else if (hash === 'instellingen') {
      title = 'Instellingen'; document.body.dataset.view = 'settings';
      renderSettings(view);
    } else {
      tab = TABS[hash] || 'path';
      document.body.dataset.view = tab;
      title = { path: 'Leerpad', practice: 'Oefenen', progress: 'Voortgang' }[tab];
      if (tab === 'path') renderPath(view);
      else if (tab === 'practice') renderPractice(view);
      else renderProgress(view);
    }
    back.hidden = !!tab || document.body.dataset.view === 'lesson';
    $('#logo').hidden = !tab;
    $('#title').textContent = title;
    view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
    $$('.tabbar a').forEach(a => a.setAttribute('aria-current', a.dataset.tab === tab ? 'page' : 'false'));
    UI.micState();
    UI.updateHeard(null);
    UI.updateLevel(-120);
    Progress.renderTop();
    Daily.renderBar();
    window.scrollTo(0, 0);
  },
  back() {
    const v = document.body.dataset.view;
    location.hash = v === 'settings' ? '#voortgang' : v === 'mode' ? '#oefenen' : '';
  },
};

// gedeelde toetsen
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || (e.target.closest && e.target.closest('input, select, textarea'))) return;
  if (e.key === 'Enter' && e.target.closest && e.target.closest('button, a')) return;
  if (current && current.keys) {
    const fn = current.keys[e.key.toLowerCase()] || (e.key === 'ArrowRight' ? current.keys.s : null);
    if (fn) { e.preventDefault(); fn(); }
  }
});

const FUR = {
  line: '#2B1A14', face: '#F4E3C9', cap: '#B98A63', mask: '#4A2F22', muzzle: '#FFF9F0', earIn: '#E4A498',
  body: '#6B4632', bib: '#F4E3C9', paw: '#4A2F22', tail: '#553524', nose: '#E8868C', noseLine: '#9C4B51',

const Mascot = {
  // mood: blij, juich, oeps, luister, ehbo, slaap, denk. crop: 'head' toont alleen het hoofd.
  svg(mood = 'blij', o = {}) {
    const F = FUR, L = `stroke="${F.line}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"`;

    const head = o.crop === 'head', raised = mood === 'juich' && !head, wave = mood === 'zwaai' && !head;
    const arm = (d) => `<path d="${d}" fill="none" stroke="${F.line}" stroke-width="22" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${F.paw}" stroke-width="14" stroke-linecap="round"/>`;
    let s = '';
    // staart en lijf (niet bij alleen het hoofd)
    if (!head) {
      s += `<path d="M146 198c26-4 44-24 40-50-3-16-16-24-26-18 10 9 12 29-1 44-6 8-14 13-22 16z" fill="${F.tail}" ${L}/>`;
      s += `<path d="M56 126c-18 18-23 46-19 74h126c4-28-1-56-19-74z" fill="${F.body}" ${L}/>`;
      s += `<path d="M78 130c-6 20-2 44 22 56 24-12 28-36 22-56z" fill="${F.bib}"/>`;
    }
    // armen
    if (raised) s += arm('M60 146C36 136 22 104 22 54') + arm('M140 146c24-10 38-42 38-92');
    if (wave) s += `<g class="m-wave">${arm('M140 146c22-8 34-34 36-70')}<ellipse cx="176" cy="72" rx="12" ry="10" fill="${F.paw}" ${L}/></g>`;
    // oren
    s += `<circle cx="46" cy="60" r="17" fill="${F.face}" ${L}/><circle cx="47" cy="61" r="8.5" fill="${F.earIn}"/>`;
    s += `<circle cx="154" cy="60" r="17" fill="${F.face}" ${L}/><circle cx="153" cy="61" r="8.5" fill="${F.earIn}"/>`;
    // hoofd met kap, masker en snuit
    s += `<path d="M100 30c40 0 66 22 66 54 0 26-18 42-40 48-10 3-18 8-26 8s-16-5-26-8c-22-6-40-22-40-48 0-32 26-54 66-54z" fill="${F.face}" ${L}/>`;
    s += `<path d="M100 33c27 0 48 12 59 30-14-6-32-7-44-1-6 3-11 7-15 12-4-5-9-9-15-12-12-6-30-5-44 1 11-18 32-30 59-30z" fill="${F.cap}"/>`;
    s += `<path d="M40 88c4-14 22-21 40-15 10 3 14 6 20 6s10-3 20-6c18-6 36 1 40 15 2 10-10 18-24 18-12 0-22-6-28-11-5-3-11-3-16 0-6 5-16 11-28 11-14 0-26-8-24-18z" fill="${F.mask}"/>`;
    s += `<ellipse cx="100" cy="114" rx="30" ry="21" fill="${F.muzzle}"/>`;
    // ogen
    if (mood === 'juich' || mood === 'luister') {
      s += `<path d="M58 92q11-14 22 0M120 92q11-14 22 0" stroke="${F.muzzle}" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
    } else if (mood === 'slaap') {
      s += `<path d="M58 88q11 9 22 0M120 88q11 9 22 0" stroke="${F.muzzle}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    } else {
      const up = mood === 'denk' ? -3 : 0, dx = mood === 'denk' ? 2 : 0;
      s += `<g class="m-eyes"><ellipse cx="${69 + dx}" cy="${88 + up}" rx="10" ry="11.5" fill="${F.eye}"/><ellipse cx="${131 + dx}" cy="${88 + up}" rx="10" ry="11.5" fill="${F.eye}"/>`;
      s += `<circle cx="${65.5 + dx}" cy="${83.5 + up}" r="4" fill="#fff"/><circle cx="${127.5 + dx}" cy="${83.5 + up}" r="4" fill="#fff"/><circle cx="${72.5 + dx}" cy="${92.5 + up}" r="1.8" fill="#fff"/><circle cx="${134.5 + dx}" cy="${92.5 + up}" r="1.8" fill="#fff"/></g>`;
    }
    if (mood === 'oeps') s += `<path d="M56 68q10-7 22-3M144 68q-10-7-22-3" ${thin}/>`;
    // wangetjes
    if (mood === 'juich' || mood === 'blij' || mood === 'ehbo' || mood === 'zwaai') s += `<ellipse cx="62" cy="110" rx="7" ry="4.5" fill="${F.blush}" opacity=".55"/><ellipse cx="138" cy="110" rx="7" ry="4.5" fill="${F.blush}" opacity=".55"/>`;

    s += `<path d="M74 112l-24-5M74 118l-24 2M126 112l24-5M126 118l24 2" stroke="${F.line}" stroke-width="2" stroke-linecap="round" opacity=".45"/>`;

    if (mood === 'ehbo') s += `<g transform="rotate(-28 136 56)"><rect x="116" y="48" width="40" height="16" rx="8" fill="${F.plaster}" ${L} stroke-width="3"/><rect x="130" y="48" width="12" height="16" fill="${F.plasterPad}"/><circle cx="123" cy="56" r="1.4" fill="${F.line}" opacity=".4"/><circle cx="149" cy="56" r="1.4" fill="${F.line}" opacity=".4"/></g>`;
    if (mood === 'luister') {
      s += `<path d="M38 66c-2-40 26-58 62-58s64 18 62 58" fill="none" stroke="${F.line}" stroke-width="12" stroke-linecap="round"/><path d="M38 66c-2-40 26-58 62-58s64 18 62 58" fill="none" stroke="${F.pick}" stroke-width="5" stroke-linecap="round"/>`;
      s += `<rect x="24" y="54" width="24" height="36" rx="11" fill="${F.pick}" ${L}/><rect x="152" y="54" width="24" height="36" rx="11" fill="${F.pick}" ${L}/>`;
    }
    if (mood === 'slaap') s += `<path d="M150 22h12l-12 14h12M170 6h8l-8 10h8" stroke="${F.pick}" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (mood === 'denk') s += `<g class="m-dots" fill="${F.pick}" stroke="${F.line}" stroke-width="2.5"><circle cx="152" cy="30" r="5"/><circle cx="168" cy="20" r="6.5"/><circle cx="186" cy="10" r="8"/></g>`;
    // plectrum in de pootjes
    const pick = (x, y, r) => `<g transform="translate(${x} ${y}) rotate(${r})"><path d="M0-16c13 0 20 4 20 11C20 6 9 18 0 26-9 18-20 6-20-5c0-7 7-11 20-11z" fill="${F.pick}" stroke="${F.pickLine}" stroke-width="3" stroke-linejoin="round"/><path d="M-6-8c4-2 9-2 12 0" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".6"/></g>`;
    if (head) { /* alleen het hoofd */ } else if (raised) {

    } else if (wave) {
      s += pick(96, 168, -8);
      s += `<ellipse cx="80" cy="168" rx="12" ry="10" fill="${F.paw}" ${L}/><ellipse cx="114" cy="170" rx="11" ry="9" fill="${F.paw}" ${L}/>`;
    } else {

    }

    const vb = head ? '16 2 168 168' : '0 0 200 200';
    const size = o.size ? ` width="${o.size}" height="${o.size}"` : '';
    return `<svg class="mascot m-${mood}${o.cls ? ' ' + o.cls : ''}" viewBox="${vb}"${size} aria-hidden="true">${s}</svg>`;
  },

const CONFETTI_COLORS = ['#F5A31A', '#2D6BD4', '#C4336F', '#7146D4', '#0B9C8E', '#FFD27A'];
const reducedMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- Confetti van muzieknoten en plectrums ----------
const Confetti = {
  burst(o = {}) {
    if (reducedMotion()) return;
    const cv = document.createElement('canvas');
    cv.className = 'confetti'; cv.setAttribute('aria-hidden', 'true');
    const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    document.body.append(cv);
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    const n = o.n || 80, x0 = o.x != null ? o.x : W / 2, y0 = o.y != null ? o.y : H * 0.38;
    const parts = Array.from({ length: n }, (_, i) => {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.1, v = 7 + Math.random() * 9;
      return { x: x0 + (Math.random() - 0.5) * 40, y: y0 + (Math.random() - 0.5) * 20, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2,
        r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.24, s: 0.8 + Math.random() * 0.7,
        kind: i % 3 === 0 ? 'pick' : i % 3 === 1 ? 'note' : 'beam', c: CONFETTI_COLORS[i % CONFETTI_COLORS.length], wob: Math.random() * 6.28 };
    });
    const t0 = performance.now(), DUR = o.dur || 2600;
    let last = t0;
    const draw = p => {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(p.s, p.s);
      ctx.fillStyle = p.c; ctx.strokeStyle = p.c;
      if (p.kind === 'pick') {
        ctx.beginPath(); ctx.moveTo(0, -8); ctx.bezierCurveTo(7, -8, 10, -6, 10, -2.5); ctx.bezierCurveTo(10, 3, 4.5, 9, 0, 13); ctx.bezierCurveTo(-4.5, 9, -10, 3, -10, -2.5); ctx.bezierCurveTo(-10, -6, -7, -8, 0, -8); ctx.fill();
      } else {
        ctx.lineWidth = 2.4; ctx.lineCap = 'round';
        const head = (x, y) => { ctx.beginPath(); ctx.ellipse(x, y, 4.6, 3.4, -0.45, 0, 6.29); ctx.fill(); };
        if (p.kind === 'note') {
          head(-3, 8); ctx.beginPath(); ctx.moveTo(1, 7); ctx.lineTo(1, -10); ctx.quadraticCurveTo(7, -6, 7, 0); ctx.stroke();
        } else {
          head(-7, 9); head(7, 6); ctx.beginPath(); ctx.moveTo(-3, 8); ctx.lineTo(-3, -9); ctx.moveTo(11, 5); ctx.lineTo(11, -12); ctx.stroke();
          ctx.lineWidth = 4.4; ctx.beginPath(); ctx.moveTo(-3, -9); ctx.lineTo(11, -12); ctx.stroke();
        }
      }
      ctx.restore();
    };
    const step = now => {
      const dt = Math.min(2.2, (now - last) / 16.67), el = now - t0;
      last = now;
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = el > DUR - 700 ? Math.max(0, (DUR - el) / 700) : 1;
      for (const p of parts) {
        p.vy += 0.34 * dt; p.vx *= Math.pow(0.985, dt); p.vy *= Math.pow(0.99, dt);
        p.wob += 0.12 * dt;
        p.x += (p.vx + Math.sin(p.wob) * 0.6) * dt; p.y += p.vy * dt; p.r += p.vr * dt;
        draw(p);
      }
      if (el < DUR) requestAnimationFrame(step); else cv.remove();
    };
    requestAnimationFrame(step);
  },
};

// ---------- Geluidjes met gitaarklank (Karplus-Strong uit de engine) ----------
const Sfx = {
  last: 0, lastPri: 0,
  on() { return Store.settings.sound !== false; },
  play(kind) {
    if (!this.on()) return;
    const pri = { tap: 0, right: 1, wrong: 1, fixed: 2, done: 2, goal: 3 }[kind] || 0, now = performance.now();
    if (now - this.last < 900 && pri < this.lastPri) return;
    this.last = now; this.lastPri = pri;
    let ctx;
    try { ctx = Engine.ensureCtx(); } catch (e) { return; }
    const t = ctx.currentTime + 0.03;
    const seq = (notes, gap, dur, gain) => { notes.forEach((m, i) => Engine.pluck(m, t + i * gap, dur, gain)); Engine.block((notes.length * gap + dur) * 1000 + 250); };
    if (kind === 'right') seq([76, 80, 83], 0.06, 0.5, 0.32);
    else if (kind === 'wrong') { Engine.pluck(47, t, 0.11, 0.38); Engine.pluck(46, t + 0.1, 0.16, 0.32); Engine.block(500); }
    else if (kind === 'fixed') seq([72, 77, 84], 0.07, 0.55, 0.32);
    else if (kind === 'done') seq([57, 61, 64, 69, 73], 0.035, 0.9, 0.3);
    else if (kind === 'goal') seq([69, 72, 74, 76, 79, 81], 0.075, 0.7, 0.32);
    else if (kind === 'tap') { Engine.click(t, false); }
  },
};

// ---------- Getal laten oplopen ----------
function countUp(el, to, o = {}) {
  const pre = o.prefix || '', suf = o.suffix || '', dur = o.dur || 700;
  if (reducedMotion() || !to) { el.textContent = pre + to + suf; return; }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = pre + Math.round(to * e) + suf;
    if (k < 1) requestAnimationFrame(step);
  };
  el.textContent = pre + '0' + suf;
  setTimeout(() => requestAnimationFrame(step), o.delay || 0);
}

// ---------- Tijdelijke instellingen voor een oefening (bij een les of sessie) ----------
const TempSettings = {
  saved: null,
  apply(mode, set) {
    if (!set || !Store.settings[mode]) return;
    if (!this.saved || this.saved.mode !== mode) { this.restore(); this.saved = { mode, prev: JSON.parse(JSON.stringify(Store.settings[mode])) }; }
    Object.assign(Store.settings[mode], set);
  },
  restore() {
    if (!this.saved) return;
    const cur = Store.settings[this.saved.mode], prev = this.saved.prev;
    for (const k of Object.keys(cur)) if (!(k in prev)) delete cur[k];
    Object.assign(cur, prev);
    this.saved = null;
    Store.saveSettings();
  },
};

// ---------- Gedeeld: noten op snaren ----------
const TOL = 0.45, HOLD = 0.18, COOLDOWN = 700;
const NoteGame = {
  pool(focusKeys) {
    const s = Store.settings, pool = [];
    for (const st of s.strings) {
      const by = new Map();
      for (let f = s.minFret; f <= s.maxFret; f++) {
        const pc = mod12(OPEN[st] + f);
        if (s.naturalsOnly && !NATURAL.has(pc)) continue;
        if (!by.has(pc)) by.set(pc, []);
        by.get(pc).push(f);
      }
      for (const [pc, frets] of by) pool.push({ s: st, pc, frets });
    }
    if (focusKeys && focusKeys.length) {
      const fp = pool.filter(it => focusKeys.includes(it.s + '-' + it.pc));
      if (fp.length) return fp;
    }
    return pool;
  },
  pick(prev, focusKeys) {
    const pool = this.pool(focusKeys);
    let cands = pool.filter(it => !prev || it.pc !== prev.pc);
    if (!cands.length) cands = pool;
    const items = Store.stats.notes.items;
    const w = cands.map(it => { const st = items[it.s + '-' + it.pc]; return st && st.n ? 1 + Math.min(2.5, st.total / st.n / 4) : 1.6; });
    let r = Math.random() * w.reduce((a, b) => a + b, 0), it = cands[cands.length - 1];
    for (let i = 0; i < cands.length; i++) { r -= w[i]; if (r <= 0) { it = cands[i]; break; } }
    return { s: it.s, pc: it.pc, frets: it.frets, name: pcName(it.pc, Store.settings.names), midis: it.frets.map(f => OPEN[it.s] + f) };
  },
  matches(t, m) {
    if (Store.settings.strict) return t.midis.some(v => Math.abs(m - v) <= TOL);
    const d = mod12(m - t.pc);
    return Math.min(d, 12 - d) <= TOL;
  },
  fretsFor(t, m) {
    if (!Store.settings.strict) return t.frets;
    let bi = 0;
    t.midis.forEach((v, i) => { if (Math.abs(m - v) < Math.abs(m - t.midis[bi])) bi = i; });
    return [t.frets[bi]];
  },
  record(t, secs, hinted) {
    const st = Store.stats.notes, key = t.s + '-' + t.pc;
    const it = st.items[key] || (st.items[key] = { n: 0, total: 0 });
    it.n++; it.total += secs;
    st.found++; st.totalTime += secs;
    if (!hinted && (st.best == null || secs < st.best)) st.best = secs;
    if (!hinted && secs <= 5) { st.streak++; st.bestStreak = Math.max(st.bestStreak, st.streak); } else st.streak = 0;
    Store.saveStats();
  },
  // hold-meter: true zodra de juiste toon lang genoeg klinkt
  hold(state, f, dt, matchFn) {
    if (f.midi == null) state.hold = Math.max(0, state.hold - dt / 0.6);
    else if (matchFn(f.midi)) state.hold = Math.min(1, state.hold + dt / HOLD);
    else state.hold = Math.max(0, state.hold - dt / 0.25);
    return state.hold >= 1;
  }
};
const rangeCaption = () => `Oefenbereik: fret ${Store.settings.minFret} t/m ${Store.settings.maxFret} · ${Store.settings.strings.length} ${Store.settings.strings.length === 1 ? 'snaar' : 'snaren'}`;

registerMode({
