  homeStat: st => (st.positions.done ? `${st.positions.done}× rond · snelste ${fmt1(st.positions.best)} s` : ''),
  mount(view) {
    this.card = promptCard('Speel op elke snaar');
    const s = Store.settings.positions;
    this.statsEl = h('div', { class: 'card' });
    const L = exLayout(view, {
      prompt: this.card, caption: h('span', { text: rangeCaption() }),
      actions: [{ id: 'hintBtn', label: 'Hint', key: 'h', onClick: () => this.hint() }, { id: 'skipBtn', label: 'Overslaan', key: 's', onClick: () => this.next() }],
      options: [field('Volgorde', seg([{ value: 'up', label: 'lage E → hoge e' }, { value: 'down', label: 'hoge e → lage E' }], s.order, v => { s.order = v; Store.saveSettings(); this.next(); }))],
      stats: this.statsEl,
    });
    this.svg = L.svg; this.keys = L.keys;
    this.pc = null;
    this.next();
    this.renderStats();
  },
  unmount() { clearTimeout(this.timer); },
  next() {
    clearTimeout(this.timer);
    const S = Store.settings;
    const order = S.strings.slice().sort((a, b) => (S.positions.order === 'up' ? b - a : a - b));
    let pcs = Array.from({ length: 12 }, (_, i) => i).filter(pc => !S.naturalsOnly || NATURAL.has(pc));
    if (this.pc != null) pcs = pcs.filter(pc => pc !== this.pc);
    pcs = shuffle(pcs);
    let steps = [];
    for (const pc of pcs) {
      steps = order.map(s => {
        const frets = [];
        for (let f = S.minFret; f <= S.maxFret; f++) if (mod12(OPEN[s] + f) === pc) frets.push(f);
        return { s, frets, midis: frets.map(f => OPEN[s] + f) };
      }).filter(st => st.frets.length);
      if (steps.length >= Math.min(2, order.length)) { this.pc = pc; break; }
    }
    this.steps = steps; this.idx = 0; this.marks = []; this.elapsed = 0; this.done = false; this.hinted = false; this.lastAccepted = null;
    this.name = pcName(this.pc, S.names);
    $('.pr-note', this.card).innerHTML = bigNoteHTML(this.name);
    $('.pr-note', this.card).setAttribute('aria-label', spoken(this.name));
    $('.pr-where', this.card).innerHTML = S.positions.order === 'up' ? 'van de <b>lage E</b> naar de <b>hoge e</b>' : 'van de <b>hoge e</b> naar de <b>lage E</b>';
    $('.pr-leds', this.card).hidden = true;
    this.card.classList.remove('hit');
    $('.pr-toast', this.card).textContent = Engine.mic ? '' : 'Druk op Start en sta de microfoon toe.';
    this.renderSteps();
    this.draw();
  },
  renderSteps() {
    $('.pr-extra', this.card).innerHTML = `<div class="steps">${this.steps.map((st, i) => `<span class="step${i < this.idx ? ' done' : i === this.idx && !this.done ? ' now' : ''}">${STR_LETTER[st.s]}</span>`).join('')}</div>`;
  },
  draw() {
    const S = Store.settings, cur = this.steps[this.idx];
    drawNeck(this.svg, { from: 0, to: Math.max(12, S.maxFret), highlight: cur && !this.done ? [cur.s] : [], marks: this.marks, range: { min: S.minFret, max: S.maxFret } });
  },
  expected() { const st = this.steps[this.idx]; return this.done || !st ? [] : st.midis; },
  hint() {
    const st = this.steps[this.idx];
    if (!st || this.done) return;
    this.hinted = true;
    this.marks = this.marks.filter(m => m.kind !== 'hint').concat(st.frets.map(f => ({ s: st.s, f, kind: 'hint', label: this.name })));
    this.draw();
    $('.pr-toast', this.card).textContent = `Hint: ${STR_NAME[st.s]}, fret ${st.frets.join(' of ')}`;
  },
  onOnset(o) { this.lastOnset = o.perfT; },
  onFrame(f, dt) {
    if (this.done) return;
    this.elapsed += dt;
    // zelfde toonhoogte als de vorige stap (bijv. lage E fret 5 en open A): opnieuw aanslaan telt
    const la = this.lastAccepted, st = this.steps[this.idx];
    if (!la || f.midi == null || !st || this.lastOnset === la.onset || f.t - this.lastOnset < 120) return;
    const m = Math.round(f.midi);
    if (m === la.midi && Math.abs(f.midi - m) <= TOL && (Store.settings.strict ? st.midis.includes(m) : mod12(m) === this.pc)) this.accept(m);
  },
  onNote(n) {
    if (this.done) return;
    const st = this.steps[this.idx];
    if (this.lastAccepted && n.midi === this.lastAccepted.midi && this.lastOnset === this.lastAccepted.onset) return;
    const ok = Store.settings.strict ? st.midis.some(v => v === n.midi) : mod12(n.midi) === this.pc;
    if (!ok) { $('.pr-toast', this.card).textContent = `Je speelde ${pcName(n.midi, Store.settings.names === 'flats' ? 'flats' : 'sharps')}. Zoek ${this.name} op de ${STR_NAME[st.s]}.`; return; }
    this.accept(n.midi);
  },
  accept(midi) {
    const st = this.steps[this.idx];
    const n = { midi };
    this.lastAccepted = { midi, onset: this.lastOnset };
    let bi = 0;
    st.midis.forEach((v, i) => { if (Math.abs(n.midi - v) < Math.abs(n.midi - st.midis[bi])) bi = i; });
    this.marks = this.marks.filter(m => m.kind !== 'hint').concat([{ s: st.s, f: st.frets[bi], kind: 'found', label: this.name }]);
    this.idx++;
    $('.pr-toast', this.card).textContent = this.idx < this.steps.length ? `Goed, nu de ${STR_NAME[this.steps[this.idx].s]}` : '';
    if (this.idx >= this.steps.length) return this.success();
    this.renderSteps(); this.draw();
  },
  success() {
    this.done = true;
    const ps = Store.stats.positions, secs = this.elapsed;
    ps.done++;
    if (!this.hinted && (ps.best == null || secs < ps.best)) ps.best = secs;
    Store.saveStats();
    this.card.classList.add('hit');
    $('.pr-toast', this.card).textContent = `Alle ${this.name}'s gevonden in ${fmt1(secs)} s`;
    this.renderSteps(); this.draw(); this.renderStats();
    Engine.ding();
    this.timer = setTimeout(() => this.next(), 1600);
  },
  renderStats() {
    const ps = Store.stats.positions;
    this.statsEl.innerHTML = '';
    this.statsEl.append(h('p', { class: 'eyebrow', text: 'Scores' }), statFigs([{ label: 'Rondes', value: String(ps.done) }, { label: 'Snelste ronde', value: sec(ps.best) }]));
  },
});

// ---------- Intervallen ----------
registerMode({
  id: 'intervals', group: 'hals', title: 'Intervallen', desc: 'Speel een toon en dan het interval erboven of eronder',
  homeStat: st => (st.intervals.n ? `${st.intervals.n} goed · gemiddeld ${fmt1(st.intervals.total / st.intervals.n)} s` : ''),
  mount(view) {
    this.card = promptCard('Interval');
    const s = Store.settings.intervals;
    this.statsEl = h('div', { class: 'card' });
    const L = exLayout(view, {
      prompt: this.card,
      actions: [{ id: 'hintBtn', label: 'Hint', key: 'h', onClick: () => this.hint() }, { id: 'skipBtn', label: 'Overslaan', key: 's', onClick: () => this.next() }],
      options: [
        field('Welke intervallen', chips(INTERVALS.map(i => ({ value: i.semis, label: i.name })), s.set.map(String), v => { s.set = v.map(Number); Store.saveSettings(); }, 1)),
        field('Richting', seg([{ value: 'up', label: 'omhoog' }, { value: 'down', label: 'omlaag' }, { value: 'both', label: 'beide' }], s.dir, v => { s.dir = v; Store.saveSettings(); this.next(); })),
        field('Begintonen', checkEl('natRoots', 'Alleen stamtonen als begintoon', s.naturalRoots, v => { s.naturalRoots = v; Store.saveSettings(); })),
      ],
      stats: this.statsEl,
    });
    this.svg = L.svg; this.keys = L.keys;
    this.next();
    this.renderStats();
  },
  unmount() { clearTimeout(this.timer); },
  next() {
    clearTimeout(this.timer);
    const s = Store.settings.intervals;
    let root, target, iv, up;
    for (let tries = 0; tries < 50; tries++) {
      const sm = Number(pick(s.set));
      iv = INTERVALS.find(i => i.semis === sm);
      up = s.dir === 'up' ? true : s.dir === 'down' ? false : Math.random() < 0.5;
      const pcs = Array.from({ length: 12 }, (_, i) => i).filter(pc => !s.naturalRoots || NATURAL.has(pc));
      const rn = pcName(pick(pcs), Store.settings.names);
      root = parseName(rn);
      target = spellFrom(root, up ? iv.steps : -iv.steps, up ? iv.semis : -iv.semis);
      if (isSimple(root) && isSimple(target) && (!this.root || spPc(root) !== spPc(this.root) || iv !== this.iv)) break;
    }
    Object.assign(this, { root, target, iv, up, phase: 'root', rootMidi: null, elapsed: 0, done: false, hinted: false, marks: [] });
    const rn = spName(root);
    $('.pr-note', this.card).innerHTML = bigNoteHTML(rn);
    $('.pr-note', this.card).setAttribute('aria-label', spoken(rn));
    $('.pr-where', this.card).innerHTML = `<b>${iv.name}</b> ${up ? 'erboven' : 'eronder'}`;
    $('.pr-leds', this.card).hidden = true;
    this.card.classList.remove('hit');
    $('.pr-toast', this.card).textContent = Engine.mic ? `Speel eerst ${rn}` : 'Druk op Start en sta de microfoon toe.';
    this.renderSteps();
    drawNeck(this.svg, { from: 0, to: 12, marks: [] });
  },
  renderSteps() {
    const rn = spName(this.root);
    $('.pr-extra', this.card).innerHTML = `<div class="steps wide"><span class="step${this.phase !== 'root' ? ' done' : ' now'}">1 · ${rn}</span><span class="step${this.done ? ' done' : this.phase === 'target' ? ' now' : ''}">2 · ${this.done ? spName(this.target) : '?'}</span></div>`;
  },
  example() {
    // voorbeeldvorm op de hals: grondtoon en interval op naburige snaren
    const rootPc = spPc(this.root), semis = this.iv.semis;
    const order = this.up ? [5, 4, 3, 2, 1] : [0, 1, 2, 3, 4];
    for (const s of order) {
      for (let f = 1; f <= 10; f++) {
        if (mod12(OPEN[s] + f) !== rootPc) continue;
        const goal = OPEN[s] + f + (this.up ? semis : -semis);
        const cands = this.up ? [s - 1, s - 2] : [s + 1, s + 2];
        for (const t of cands) {
          if (t < 0 || t > 5) continue;
          const tf = goal - OPEN[t];
          if (tf >= 0 && tf <= 15 && Math.abs(tf - f) <= 4) return [{ s, f, kind: 'todo root', label: spName(this.root) }, { s: t, f: tf, kind: 'found', label: spName(this.target) }];
        }
      }
    }
    return [];
  },
  expected() {
    if (this.done) return [];
    if (this.phase === 'root') return [48 + spPc(this.root)];
    return [this.rootMidi + (this.up ? this.iv.semis : -this.iv.semis)];
  },
  hint() {
    if (this.done) return;
    this.hinted = true;
    this.marks = this.example();
    drawNeck(this.svg, { from: 0, to: 12, marks: this.marks });
    $('.pr-toast', this.card).textContent = `${spName(this.target)}. ${shapeText(this.iv.semis, this.up)}`;
  },
  onFrame(f, dt) { if (!this.done) this.elapsed += dt; },
  onNote(n) {
    if (this.done) return;
    const toast = $('.pr-toast', this.card);
    const heard = pcName(n.midi, Store.settings.names === 'flats' ? 'flats' : 'sharps');
    if (this.phase === 'root') {
      if (mod12(n.midi) !== spPc(this.root)) { toast.textContent = `Je speelde ${heard}. Begin met ${spName(this.root)}.`; return; }
      this.rootMidi = n.midi; this.phase = 'target';
      toast.textContent = `Nu de ${this.iv.name} ${this.up ? 'erboven' : 'eronder'}`;
      this.renderSteps();
      return;
    }
    const want = this.rootMidi + (this.up ? this.iv.semis : -this.iv.semis);
    const octave = this.iv.semis === 12;
    if (!octave && mod12(n.midi) === spPc(this.root)) return;   // grondtoon klinkt nog
    const ok = Store.settings.strict || octave ? n.midi === want : mod12(n.midi) === mod12(want);
    if (!ok) { toast.textContent = `Je speelde ${heard}. Dat is niet de ${this.iv.name}.`; return; }
    this.done = true;
    const st = Store.stats.intervals; st.n++; st.total += this.elapsed; Store.saveStats();
    this.card.classList.add('hit');
    toast.textContent = `Goed! ${spName(this.root)} → ${spName(this.target)} · ${this.iv.name}, ${this.iv.semis} halve ${this.iv.semis === 1 ? 'toon' : 'tonen'}`;
    this.renderSteps();
    this.marks = this.example();
    drawNeck(this.svg, { from: 0, to: 12, marks: this.marks });
    this.renderStats();
    Engine.ding();
    this.timer = setTimeout(() => this.next(), 2200);
  },
  renderStats() {
    const st = Store.stats.intervals;
    this.statsEl.innerHTML = '';
    this.statsEl.append(h('p', { class: 'eyebrow', text: 'Scores' }), statFigs([{ label: 'Goed', value: String(st.n) }, { label: 'Gemiddeld', value: st.n ? sec(st.total / st.n) : '–' }]));
  },
});

        field('Soort', seg([{ value: 'major', label: 'majeur' }, { value: 'minor', label: 'mineur' }], s.quality, v => { s.quality = v; Store.saveSettings(); this.newKey(); })),

    if (this.deg != null && (!s.stay || !this.queue.length)) return this.newKey();
    if (!this.queue.length) return this.newKey();
    this.deg = this.queue.shift();
    this.elapsed = 0; this.done = false; this.hinted = false;
    const s2 = Store.settings.degrees;
    const qual = s2.quality === 'major' ? 'majeur' : 'mineur';

  draw(extra) {

    for (const s of S.strings) for (let f = S.minFret; f <= S.maxFret; f++) if (mod12(OPEN[s] + f) === rootPc) marks.push({ s, f, kind: 'todo root', label: '1' });
    drawNeck(this.svg, { from: 0, to: Math.max(12, S.maxFret), marks: marks.concat(extra || []), range: { min: S.minFret, max: S.maxFret } });

    const S = Store.settings, t = this.tones[this.deg - 1], out = [];

    return out;
  },
  expected() { return this.done ? [] : [48 + this.tones[this.deg - 1].pc]; },
  hint() {

    $('.pr-toast', this.card).textContent = `Trap ${this.deg} in ${this.key} is ${this.tones[this.deg - 1].name}`;

    this.done = true;
    const st = Store.stats.degrees; st.n++; st.total += this.elapsed; Store.saveStats();
    this.card.classList.add('hit');
    $('.pr-toast', this.card).textContent = `Goed! Trap ${this.deg} in ${this.key} = ${t.name}`;
    $('.pr-extra', this.card).innerHTML = `<div class="scale-line">${this.tones.map((x, i) => `<span class="${i === this.deg - 1 ? 'on' : ''}"><small>${i + 1}</small>${x.name}</span>`).join('')}</div>`;
    this.draw(this.targetMarks('found'));
    this.renderStats();
    Engine.ding();
    this.timer = setTimeout(() => this.advance(false), 1800);

      actions: [{ id: 'againBtn', label: 'Opnieuw', key: 'r', onClick: () => this.reset() }, { id: 'nextBox', label: 'Volgende', key: 's', onClick: () => this.nextBox() }],

        field('Op de hals', seg([{ value: 'names', label: 'notenamen' }, { value: 'degrees', label: 'trappen' }, { value: 'none', label: 'uit je hoofd' }], s.labels, v => { s.labels = v; Store.saveSettings(); this.draw(); }), 'Uit je hoofd: de box staat niet op de hals, alleen wat je al gespeeld hebt.'),
      ],

  buildPickers() {

  },
  nextBox() {
    const s = Store.settings.scales;
    s.box = (s.box % boxCount(s.scale)) + 1;
    Store.saveSettings(); this.buildPickers(); this.reset();
  },
  reset() {
    clearTimeout(this.timer);
    const s = Store.settings.scales;
    this.box = scaleBox(s.scale, s.root, s.box);
    this.seq = s.order === 'updown' ? this.box.concat(this.box.slice(0, -1).reverse()) : this.box.slice();
    this.idx = 0; this.errors = 0; this.t0 = null; this.done = false; this.played = [];
    $('.pr-note', this.card).innerHTML = bigNoteHTML(s.root);
    $('.pr-note', this.card).setAttribute('aria-label', spoken(s.root));
    $('.pr-where', this.card).innerHTML = `<b>${SCALES[s.scale].short}</b><small>box ${s.box}</small>`;
    $('.pr-leds', this.card).hidden = true;
    this.card.classList.remove('hit');
    $('.pr-toast', this.card).textContent = Engine.mic ? 'Begin bij de laagste noot' : 'Druk op Start en sta de microfoon toe.';
    this.renderProgress();
    this.draw();
  },
  renderProgress() {
    const s = Store.settings.scales, best = Store.stats.scales.best[`${s.scale}-${s.root}-${s.box}-${s.order}`];
    $('.pr-extra', this.card).innerHTML = `<div class="progress"><span style="width:${(100 * this.idx / this.seq.length).toFixed(1)}%"></span></div><div class="prog-text">${this.idx}/${this.seq.length} noten${this.errors ? ` · ${this.errors} mis` : ''}${best ? ` · record ${fmt1(best)} s` : ''}</div>`;
  },
  draw() {
    const s = Store.settings.scales;
    const lo = Math.min(...this.box.map(p => p.f)), hi = Math.max(...this.box.map(p => p.f));
    const from = Math.max(0, lo - 1), to = Math.max(from + 5, hi + 1);
    const cur = this.done ? null : this.seq[this.idx];
    const marks = [];
    for (const p of this.box) {
      const isPlayed = this.played.some(q => q.s === p.s && q.f === p.f);
      const isCur = cur && cur.s === p.s && cur.f === p.f;
      if (s.labels === 'none' && !isPlayed) continue;
      const label = s.labels === 'degrees' ? p.label : p.name;
      let kind = isPlayed ? 'found' : 'todo';
      if (isCur) kind = 'next';
      if (p.label === 'R') kind += ' root';
      marks.push({ s: p.s, f: p.f, kind, label });
    }
    drawNeck(this.svg, { from, to, marks, highlight: cur && s.labels !== 'none' ? [cur.s] : [] });
  },
  expected() { return this.done ? [] : [this.seq[this.idx].midi]; },
  onNote(n) {
    if (this.done) return;
    const exp = this.seq[this.idx];
    const ok = Store.settings.strict ? n.midi === exp.midi : mod12(n.midi) === exp.pc;
    if (!ok) {
      const prev = this.seq[this.idx - 1];
      if (prev && (n.midi === prev.midi || (!Store.settings.strict && mod12(n.midi) === prev.pc))) return;   // vorige noot klinkt nog
      this.errors++;
      $('.pr-toast', this.card).textContent = Store.settings.scales.labels === 'none' ? 'Mis. Probeer het nog eens.' : `Je speelde ${pcName(n.midi, 'sharps')}, de volgende is ${exp.name}`;
      this.renderProgress();
      return;
    }
    if (this.t0 == null) this.t0 = n.t;
    this.played.push(exp);
    this.idx++;
    $('.pr-toast', this.card).textContent = '';
    if (this.idx >= this.seq.length) return this.success(n.t);
    if (Store.settings.scales.order === 'updown' && this.idx === this.box.length) this.played = [exp];   // terugweg: opnieuw kleuren
    this.renderProgress(); this.draw();
  },
  success(t) {
    this.done = true;
    const s = Store.settings.scales, secs = (t - this.t0) / 1000;
    const st = Store.stats.scales, key = `${s.scale}-${s.root}-${s.box}-${s.order}`;
    st.runs++;
    const rec = !this.errors && (st.best[key] == null || secs < st.best[key]);
    if (rec) st.best[key] = secs;
    Store.saveStats();
    this.card.classList.add('hit');
    $('.pr-toast', this.card).textContent = `Klaar in ${fmt1(secs)} s${this.errors ? ` met ${this.errors} mis` : rec ? ' · nieuw record' : ''}. Nog een keer!`;
    this.renderProgress(); this.draw(); this.renderStats();
    Engine.ding();
    this.timer = setTimeout(() => this.reset(), 2200);
  },
  renderStats() {
    const st = Store.stats.scales, s = Store.settings.scales;
    this.statsEl.innerHTML = '';
    const best = st.best[`${s.scale}-${s.root}-${s.box}-${s.order}`];
    this.statsEl.append(h('p', { class: 'eyebrow', text: 'Scores' }), statFigs([{ label: 'Keer gespeeld', value: String(st.runs) }, { label: 'Record deze box', value: sec(best) }]));
  },
});

const EAR_LEVELS = ['', 'Eén noot', 'Twee noten', 'Drie noten', 'Loopje van 4 à 5 noten', 'Blueslicks'];
registerMode({
  id: 'ear', group: 'gehoor', title: 'Op gehoor naspelen', desc: 'De app speelt iets voor, jij zoekt het op de hals',
  homeStat: st => { const ok = Object.values(st.ear.ok).reduce((a, b) => a + b, 0); return ok ? `${ok} keer goed nagespeeld` : ''; },

// ---------- Leerpad: vraaggeneratoren ----------
// Itemtypes:
//  mc:    { prompt, sub, options[], answer, explain }
//  multi: { prompt, sub, choices[], correct[], explain }
//  tap:   { prompt, sub, from, to, marks[], valid[{s,f}], explain }
//  play:  { prompt, sub, big, steps[{k:'pc'|'rel'|'set', ...}], neck?, hint?, explain? }
function mc(skill, prompt, correct, distractors, explain, sub) {
  const c = String(correct);
  const ds = shuffle(uniq(distractors.map(String)).filter(d => d !== c)).slice(0, 3);
  const options = shuffle([c, ...ds]);
  return { type: 'mc', skill, prompt, sub, options, answer: options.indexOf(c), explain };
}
function multi(skill, prompt, choices, correct, explain, sub) { return { type: 'multi', skill, prompt, sub, choices, correct, explain }; }
function tapItem(skill, prompt, o) { return Object.assign({ type: 'tap', skill, prompt, from: 0, to: 12 }, o); }
function playItem(skill, prompt, o) { return Object.assign({ type: 'play', skill, prompt }, o); }
const nm = (root, steps, semis) => spName(spellFrom(parseName(root), steps, semis));
const pcOf = name => spPc(parseName(name));
// noten-chips: de juiste namen + afleiders, chromatisch gesorteerd vanaf de grondtoon
function noteChips(correct, rootName, flats, extra) {
  const used = new Set(correct.map(pcOf));
  const pool = [];
  for (let pc = 0; pc < 12; pc++) if (!used.has(pc)) pool.push((flats ? FLAT_NAMES : SHARP_NAMES)[pc]);
  const chips = correct.concat(shuffle(pool).slice(0, extra == null ? Math.max(3, 9 - correct.length) : extra));
  const r = pcOf(rootName);
  return chips.sort((a, b) => mod12(pcOf(a) - r) - mod12(pcOf(b) - r) || a.localeCompare(b));
}

    return mc('harm7', `Welke noot wordt verhoogd in ${key} harmonisch mineur?`, raised, [nat, nm(key, 5, 9), nm(key, 2, 4), nm(key, 5, 8)], `Trap 7 gaat een halve toon omhoog: ${nat} wordt ${raised}. Zo krijg je weer een leidtoon naar ${key}.`);

  melodic: () => mc('melodic', 'Wat is er anders aan melodisch mineur (omhoog)?', 'Trap 6 en 7 zijn verhoogd', ['Alleen trap 7 is verhoogd', 'Trap 3 is verhoogd', 'Er zijn maar vijf tonen'], 'Melodisch mineur verhoogt omhoog trap 6 en 7, zodat de grote sprong tussen 6 en 7 verdwijnt. Omlaag speel je vaak gewoon natuurlijk mineur.'),
  relMajor: () => {

  },
  parallel: () => mc('parallel', 'Wat is het verschil tussen A mineur en C majeur?', 'Zelfde noten, ander middelpunt', ['Andere noten, zelfde middelpunt', 'A mineur heeft één kruis meer', 'Er is geen enkel verschil'], 'A mineur en C majeur gebruiken dezelfde zeven noten. Het verschil is de grondtoon waar de muziek naartoe trekt.'),
  playHarm7: () => {
    const key = pick(['A', 'E', 'D']), raised = nm(key, 6, 11);

  },

  // ---- unit 6: akkoorden bouwen ----
  triadFormula: () => {
    const t = pick([{ k: 'maj', n: 'majeurakkoord', f: '1 3 5' }, { k: 'min', n: 'mineurakkoord', f: '1 ♭3 5' }, { k: 'dim', n: 'verminderd akkoord', f: '1 ♭3 ♭5' }, { k: 'sus4', n: 'sus4-akkoord', f: '1 4 5' }]);
    return mc('triad-formula', `Uit welke trappen bestaat een ${t.n}?`, t.f, ['1 3 5', '1 ♭3 5', '1 ♭3 ♭5', '1 4 5', '1 3 ♯5'], 'Majeur 1 3 5, mineur 1 ♭3 5, verminderd 1 ♭3 ♭5, sus4 1 4 5.');
  },
  chordNotes: types => {
    for (let i = 0; i < 40; i++) {
      const type = pick(types), root = pick(['C', 'D', 'E', 'F', 'G', 'A', 'B♭', 'E♭']);
      if (!chordOk(type, root)) continue;
      const tones = chordTones(type, root);
      return multi('chord-notes-' + type, `Tik de noten van ${chordName(root, type)}`, noteChips(tones.map(t => t.name), root, root.includes('♭') || root === 'F', 4), tones.map(t => t.name), `${chordName(root, type)}: ${tones.map(t => `${t.name} (${t.label})`).join(', ')}.`);
    }
    return G.triadFormula();
  },
  whichChord: types => {
    for (let i = 0; i < 40; i++) {
      const type = pick(types), root = pick(['C', 'D', 'E', 'F', 'G', 'A']);
      if (!chordOk(type, root)) continue;
      const names = chordTones(type, root).map(t => t.name).join(' ');
      const alts = Object.keys(CHORDS).filter(k => k !== type && chordOk(k, root)).map(k => chordName(root, k));
      return mc('which-chord', `Welk akkoord bestaat uit ${names}?`, chordName(root, type), alts, `${names} = ${chordName(root, type)}: ${CHORDS[type].name}.`);
    }
    return G.triadFormula();
  },
  seventhDiff: () => mc('seventh-diff', 'Wat is het verschil tussen Cmaj7 en C7?', 'De septiem: B in Cmaj7, B♭ in C7', ['De terts: E in Cmaj7, E♭ in C7', 'De kwint: G in Cmaj7, G♭ in C7', 'Er is geen verschil'], 'maj7 heeft een grote septiem (B), een dominant 7 een kleine septiem (B♭). Die kleine septiem geeft de onrustige, bluesy klank.'),
  thirdMakes: () => mc('third-makes', 'Welke toon maakt het verschil tussen C en Cm?', 'De terts: E of E♭', ['De grondtoon', 'De kwint: G of G♭', 'De septiem'], 'C = C E G, Cm = C E♭ G. Alleen de terts verschilt.'),
  playChordTones: types => {
    for (let i = 0; i < 40; i++) {
      const type = pick(types), root = pick(['E', 'A', 'D', 'G', 'C']);
      if (!chordOk(type, root)) continue;
      const tones = chordTones(type, root);
      return playItem('play-chord-' + type, `Speel de tonen van ${chordName(root, type)}`, { big: chordName(root, type), sub: 'in elke volgorde', steps: [{ k: 'set', pcs: tones.map(t => t.pc), names: tones.map(t => t.name), labels: tones.map(t => t.label) }], hint: tones.map(t => t.name).join(' ') });
    }
    return G.playFifth();
  },

  // ---- unit 7: akkoorden binnen een toonsoort ----
  diaQuality: () => {
    const d = 1 + Math.floor(Math.random() * 7), q = ['majeur', 'mineur', 'mineur', 'majeur', 'majeur', 'mineur', 'verminderd'][d - 1];
    return mc('dia-quality', `Wat voor akkoord staat op trap ${d} in een majeurtoonsoort?`, q, ['majeur', 'mineur', 'verminderd'], 'In majeur: I ii iii IV V vi vii°. Hoofdletters zijn majeur, kleine letters mineur, ° is verminderd.');
  },
  diaChord: () => {
    const key = pick(['C', 'G', 'D', 'A', 'F']), d = pick([2, 3, 4, 5, 6]), c = diatonic(key, false, d);
    const alts = [1, 2, 3, 4, 5, 6].filter(x => x !== d).map(x => diatonic(key, false, x).name).concat([c.root + (c.type === 'min' ? '' : 'm')]);
    return mc('dia-chord', `Wat is het ${c.roman}-akkoord in ${key} majeur?`, c.name, alts, `In ${key} majeur: ${[1, 2, 3, 4, 5, 6, 7].map(x => diatonic(key, false, x)).map(x => `${x.roman}=${x.name}`).join(' ')}.`);
  },
  romanOf: () => {
    const key = pick(['C', 'G', 'D', 'A', 'F']), d = pick([2, 3, 4, 5, 6]), c = diatonic(key, false, d);
    return mc('roman-of', `Welke trap is ${c.name} in ${key} majeur?`, c.roman, ROMAN_MAJOR.filter(r => r !== c.roman), `In ${key} majeur: ${[1, 2, 3, 4, 5, 6, 7].map(x => diatonic(key, false, x)).map(x => `${x.roman}=${x.name}`).join(' ')}.`);
  },
  functionOf: () => {
    const d = pick([1, 4, 5]);
    return mc('function-of', `Welke functie heeft het ${ROMAN_MAJOR[d - 1]}-akkoord?`, FUNCTION_OF[d], ['tonica', 'subdominant', 'dominant', 'mediant'], 'I is de tonica (thuis), IV de subdominant (weg van huis) en V de dominant (wil terug naar I).');
  },
  v7: () => {
    const key = pick(['C', 'G', 'D', 'A', 'E', 'F']), v = scaleTones('major', key)[4].name;
    return mc('v7', `Wat is het V7-akkoord in ${key} majeur?`, v + '7', [v + 'maj7', key + '7', v + 'm7', nm(key, 3, 5) + '7'], `Trap 5 in ${key} is ${v}. Met een kleine septiem erbij wordt dat ${v}7, het dominantseptiemakkoord.`);
  },
  whyV: () => mc('why-v', 'Waarom wil het V7-akkoord zo graag naar I?', 'De leidtoon in V7 wil een halve toon omhoog naar de grondtoon', ['Omdat het het hardste akkoord is', 'Omdat het altijd mineur is', 'Omdat er geen terts in zit'], 'In G7 zit B, de leidtoon van C. B wil naar C en F wil naar E: zo valt alles op zijn plek in C.'),

    const key = pick(['C', 'G', 'D', 'A']), d = pick([2, 4, 5, 6]), c = diatonic(key, false, d);
    return playItem('play-dia-root', `Speel de grondtoon van het ${c.roman}-akkoord in ${key} majeur`, { big: c.roman, sub: `in ${key} majeur`, steps: [{ k: 'pc', pc: pcOf(c.root), name: c.root }], hint: `Het ${c.roman}-akkoord is ${c.name}.` });

  playDiaChord: () => {
    const key = pick(['C', 'G', 'D', 'A']), d = pick([1, 4, 5, 6]), c = diatonic(key, false, d), tones = chordTones(c.type, c.root);

  // ---- unit 8: progressies ----
  prog145: () => {
    const key = pick(['E', 'A', 'D', 'G', 'C']), ch = [1, 4, 5].map(d => diatonic(key, false, d).name);
    return mc('prog-145', `Wat zijn I, IV en V in ${key} majeur?`, ch.join(' – '), [[1, 2, 5], [1, 4, 6], [1, 3, 5], [2, 4, 5]].map(ds => ds.map(d => diatonic(key, false, d).name).join(' – ')), `Tel de trappen: ${key} (1), ${ch[1]} (4), ${ch[2]} (5).`);

  prog251: () => {
    const key = pick(['C', 'G', 'D', 'F', 'B♭']), ch = [2, 5, 1].map(d => diatonic(key, false, d).name);
    return mc('prog-251', `Wat is ii–V–I in ${key} majeur?`, ch.join(' – '), [[2, 4, 1], [6, 5, 1], [2, 5, 6]].map(ds => ds.map(d => diatonic(key, false, d).name).join(' – ')).concat([`${ch[0].replace('m', '')} – ${ch[1]} – ${ch[2]}`]), `ii–V–I in ${key}: ${ch.join(' – ')}. Het meest gebruikte slot in jazz.`);

  blues12: () => {
    const q = pick([{ q: 'Welk akkoord speel je in maat 5 van een 12-maten blues?', a: 'IV' }, { q: 'Welk akkoord speel je in maat 9 van een 12-maten blues?', a: 'V' }, { q: 'Welk akkoord speel je in maat 10 van een 12-maten blues?', a: 'IV' }, { q: 'Hoeveel maten begint een standaard 12-maten blues op I?', a: '4' }]);
    return mc('blues12', q.q, q.a, q.a === '4' ? ['2', '3', '6'] : ['I', 'IV', 'V', 'vi'], 'De basisvorm: I I I I | IV IV I I | V IV I I.');
  },
  bluesKey: () => {
    const key = pick(['A', 'E', 'G', 'D', 'C']), ch = [1, 4, 5].map(d => scaleTones('major', key)[d - 1].name + '7');
    return mc('blues-key', `Welke drie akkoorden gebruik je voor een blues in ${key}?`, ch.join(' – '), [[1, 4, 5].map(d => scaleTones('major', key)[d - 1].name).join(' – ') + 'm', [1, 2, 5].map(d => scaleTones('major', key)[d - 1].name + '7').join(' – '), [1, 4, 6].map(d => scaleTones('major', key)[d - 1].name + '7').join(' – ')], `I, IV en V, alle drie als dominant 7: ${ch.join(', ')}.`);
  },
  prog1564: () => {
    const key = pick(['C', 'G', 'D', 'A']), ch = [1, 5, 6, 4].map(d => diatonic(key, false, d).name);
    return mc('prog-1564', `Wat is I–V–vi–IV in ${key} majeur?`, ch.join(' – '), [[1, 4, 6, 5], [1, 5, 3, 4], [6, 4, 1, 5]].map(ds => ds.map(d => diatonic(key, false, d).name).join(' – ')), `I–V–vi–IV in ${key}: ${ch.join(' – ')}. Een van de meest gebruikte akkoordenschema's in pop.`);
  },
  playProg: () => {
    const key = pick(['C', 'G', 'D', 'A', 'E']), prog = pick([[1, 4, 5], [2, 5, 1], [1, 5, 6, 4], [1, 6, 4, 5]]);
    const ch = prog.map(d => diatonic(key, false, d));
    return playItem('play-prog', `Speel de grondtonen van ${ch.map(c => c.roman).join('–')} in ${key} majeur`, { big: ch.map(c => c.roman).join('–'), sub: `in ${key} majeur`, steps: ch.map(c => ({ k: 'pc', pc: pcOf(c.root), name: c.root })), hint: ch.map(c => c.name).join(' – ') });
  },

  // ---- latere onderwerpen ----
  playBox: (scale, root, box) => {
    const pos = scaleBox(scale, root, box);
    const lo = Math.min(...pos.map(p => p.f)), hi = Math.max(...pos.map(p => p.f));
    return playItem(`play-box-${scale}-${box}`, `Speel ${root} ${SCALES[scale].short}, box ${box}, omhoog`, { big: root, sub: `${SCALES[scale].short} · box ${box}`, steps: pos.map(p => ({ k: 'pc', pc: p.pc, name: p.name, pos: { s: p.s, f: p.f } })), neck: { from: Math.max(0, lo - 1), to: hi + 1, marks: pos.map(p => ({ s: p.s, f: p.f, kind: p.label === 'R' ? 'todo root' : 'todo', label: p.name })) } });
  },
  scaleNotesQ: (scale, root) => {
    const tones = scaleTones(scale, root).map(t => t.name);
    return multi('scale-notes-' + scale, `Tik alle noten van ${root} ${SCALES[scale].short}`, noteChips(tones, root, root.includes('♭') || ['F', 'D', 'G', 'C'].includes(root) && scale !== 'major', 3), tones, `${root} ${SCALES[scale].short}: ${tones.join(' ')}.`);
  },
  scaleFormulaQ: scale => {
    const f = SCALES[scale].degs.map(d => d.label.replace('R', '1')).join(' ');
    const others = Object.keys(SCALES).filter(k => k !== scale).map(k => SCALES[k].degs.map(d => d.label.replace('R', '1')).join(' '));
    return mc('scale-formula-' + scale, `Welke trappen heeft ${SCALES[scale].short}?`, f, others, `${SCALES[scale].name}: ${f}.`);
  },
  notePlay: () => {
    const t = NoteGame.pick(null);
    return playItem('note-play', `Speel ${t.name} op de ${STR_NAME[t.s]}`, { big: t.name, sub: `op de ${STR_NAME[t.s]}`, steps: [{ k: 'pc', pc: t.pc, name: t.name, string: t.s, frets: t.frets }], highlight: [t.s], hint: `Fret ${t.frets.join(' of ')}` });
  },
};

// alle knooppunten van een unit, inclusief eigen vragen uit de les en een unittoets
function unitNodes(unit) {
  const tp = TOPICS[unit.topic] || TOPICS.generic;
  const p = Object.assign({ set: ALL_SEMIS, scale: 'minpent', root: 'A', boxes: [1, 2] }, unit.params || {});
  const nodes = tp.nodes.map(n => ({ title: n.title, gen: () => n.gen(p) }));
  const authored = authoredItems(unit);
  if (unit.topic === 'generic' && !authored.length) nodes.shift();   // geen eigen vragen: geen lege theorieles
  if (authored.length) {
    const i = unit.topic === 'generic' ? 0 : nodes.length - 1;
    const base = nodes[i].gen;
    nodes[i] = { title: unit.topic === 'generic' ? 'Uit de les' : nodes[i].title, gen: () => shuffle(base().concat(authoredItems(unit))) };
  }
  nodes.push({ title: 'Unittoets', test: true, gen: () => {
    let all = [];

  } });

    const p = Object.assign({ scale: 'minpent', root: 'A', boxes: [1, 2] }, unit.params || {});

// ---------- Herhalen: vragen uit afgeronde lessen, zwakke eerst ----------
const Review = {
  candidates() {

      for (const x of cands) { r -= x.w; if (r <= 0) { c = x; break; } }

    }
    const extras = shuffle([{ mode: 'challenge', minutes: 2, sub: '60 seconden' }, { mode: 'scales', minutes: 3, sub: 'Toonladders' }, { mode: 'positions', minutes: 2, sub: 'Alle posities' }, { mode: 'ear', minutes: 3, sub: 'Op gehoor naspelen' }]);
    for (const x of extras) { if (est >= remainMin) break; add({ kind: 'drill', mode: x.mode, minutes: x.minutes, title: 'Extra', sub: x.sub }); }
    return steps;
  },
  showPlan() {
    if (this.active) return this.run();
    const steps = this.plan(), total = steps.reduce((a, s) => a + s.minutes, 0);
    const met = Progress.met(todayKey());
    const sheet = h('div', { class: 'sheet-wrap', onclick: e => { if (e.target === sheet) sheet.remove(); } },
      h('div', { class: 'sheet' },
        h('div', { class: 'plan-head' }, h('div', { class: 'plan-fret', html: Mascot.svg(met ? 'juich' : 'zwaai') }),
          h('div', {}, h('h3', { text: met ? 'Extra oefenen' : 'Oefen vandaag' }), h('p', { class: 'help', text: `${total} minuten in ${steps.length} stappen${met ? '. Je dagdoel is al gehaald.' : '.'}` }))),
        h('ol', { class: 'plan' }, steps.map((s, i) => h('li', {}, h('span', { class: 'pl-n', text: String(i + 1) }), h('div', {}, h('b', { text: s.title }), h('small', { text: s.sub })), h('span', { class: 'pl-m', text: `${s.minutes} min` })))),
        h('p', { class: 'help', text: 'De oefentijd telt alleen als je echt bezig bent. Tussen de stappen ga je vanzelf door.' }),
        h('button', { class: 'primary big', type: 'button', text: 'Start', onclick: () => { sheet.remove(); this.start(steps); } })));
    document.body.append(sheet);
  },
  start(steps) {
    this.steps = steps; this.idx = 0; this.active = true;
    this.startXP = Store.stats.xp || 0; this.startSecs = Progress.day().secs;
    const needMic = !Engine.mic && !((Store.settings.cantPlayUntil || 0) > Date.now());
    Loader.run({ title: 'Oefen vandaag', sub: needMic ? 'Microfoon aanzetten…' : `${steps.length} stappen`, mood: 'luister', wait: needMic ? Engine.startMic() : null }, () => this.run());
  },
  run() {
    const st = this.steps[this.idx];
    if (!st) return this.finish();
    clearInterval(this.timer);
    if (st.kind === 'node') {
      const units = PathData.units(), u = units.find(x => x.lesson === st.ref.unit.lesson) || st.ref.unit;
      const nodes = unitNodes(u);
      if (nodeState(u, nodes, st.ref.index) === 'done') { const nx = nextNode(); if (nx) { st.ref = nx; st.sub = `Unit ${nx.unitNo}: ${nx.node.title}`; } }
      const nodes2 = unitNodes(st.ref.unit);
      startNode(st.ref.unit, st.ref.index, nodes2, () => this.advance());
    } else if (st.kind === 'bin') {
      if (!Bin.items().length) return this.advance();
      Bin.start({ after: () => this.advance(), exit: () => { location.hash = ''; } });
    } else if (st.kind === 'review') {
      const items = Review.build(8);
      if (!items.length) return this.advance();
      Lesson.open({ title: 'Herhalen', items, xp: 10, onDone: () => this.advance(), onExit: () => { location.hash = ''; } });
    } else {
      // instellingen die bij de les horen gelden alleen tijdens deze stap
      if (st.set) TempSettings.apply(st.mode, st.set);
      this.left = st.minutes * 60;
      if (location.hash === '#m-' + st.mode) Router.render(); else location.hash = '#m-' + st.mode;
      this.timer = setInterval(() => this.tick(), 1000);
    }
    this.renderBar();
  },
  tick() {
    const st = this.steps[this.idx];
    if (!this.active || !st || st.kind !== 'drill') return;
    const onIt = current && current.id === st.mode;
    if (Engine.mic && onIt && document.visibilityState === 'visible') {
      this.left--;
      if (this.left <= 0) { if (Engine.ctx && Sfx.on()) Engine.chime(); return this.advance(); }
    }
    this.renderBar();
  },
  restore() { TempSettings.restore(); },
  advance() { clearInterval(this.timer); this.restore(); this.idx++; if (this.idx >= this.steps.length) return this.finish(); this.run(); },
  stop() { this.active = false; clearInterval(this.timer); this.restore(); this.renderBar(); if (location.hash.startsWith('#m-')) location.hash = ''; },
  finish() {
    this.active = false; clearInterval(this.timer); this.restore(); this.renderBar();
    const min = Math.max(0, Math.round((Progress.day().secs - this.startSecs) / 60)), xp = Math.max(0, (Store.stats.xp || 0) - this.startXP);
    if (location.hash === '' || location.hash === '#') Router.render(); else location.hash = '';
    setTimeout(() => this.celebrate(min, xp), 60);
  },
  celebrate(min, xp) {
    const sk = Progress.streak();
    const sheet = h('div', { class: 'sheet-wrap', onclick: e => { if (e.target === sheet) sheet.remove(); } },
      h('div', { class: 'sheet center' },
        h('div', { class: 'sheet-mascot party', html: Mascot.svg(sk.today ? 'juich' : 'blij') }),
        h('h3', { text: 'Sessie klaar!' }),
        h('p', { class: 'help', text: `${min} ${min === 1 ? 'minuut' : 'minuten'} geoefend en ${xp} XP verdiend.${sk.today ? ` Je reeks staat op ${sk.n} ${sk.n === 1 ? 'dag' : 'dagen'}.` : ''}` }),
        Progress.goalLine(),
        h('button', { class: 'primary big', type: 'button', text: 'Verder', onclick: () => sheet.remove() })));
    document.body.append(sheet);
  },
  renderBar() {
    const bar = $('#sessionBar');
    if (!bar) return;
    if (!this.active) { bar.hidden = true; bar._k = ''; return; }
    const st = this.steps[this.idx];
    if (!st) { bar.hidden = true; return; }
    const onIt = st.kind === 'drill' && current && current.id === st.mode;
    const mm = `${Math.floor(this.left / 60)}:${String(this.left % 60).padStart(2, '0')}`;
    const dots = this.steps.map((s, i) => `<i class="${i < this.idx ? 'done' : i === this.idx ? 'now' : ''}"></i>`).join('');
    const k = [this.idx, onIt, onIt ? mm : '', Engine.mic].join('|');
    bar.hidden = false;
    if (bar._k === k) return;
    bar._k = k;
    bar.innerHTML = `<span class="sb-dots">${dots}</span><span class="sb-txt"><b>${onIt ? st.sub : 'Oefen vandaag'}</b>${onIt ? (Engine.mic ? '' : ', druk op Start') : `, stap ${this.idx + 1} van ${this.steps.length}`}</span>${onIt ? `<span class="sb-time">${mm}</span>` : ''}`;
    bar.append(onIt ? h('button', { type: 'button', text: 'Volgende', onclick: () => this.advance() }) : h('button', { type: 'button', class: 'primary', text: 'Ga verder', onclick: () => this.run() }), h('button', { type: 'button', text: 'Stop', onclick: () => this.stop() }));
  },
};

// ---------- Oefenen: het pedalboard ----------
const HUB = [
  { title: 'De hals', ids: ['notes', 'positions', 'intervals', 'degrees'] },
  { title: 'Solo’s en gehoor', ids: ['scales', 'chords', 'bends', 'ear'] },
  { title: 'Uitdaging', ids: ['challenge', 'heatmap'] },
  { title: 'Gereedschap', ids: ['metro', 'tuner'], tools: true },
];
const PEDAL_SUB = {
  notes: 'Vind de noot op de snaar', positions: 'Eén noot, elke snaar', intervals: 'Van toon naar toon', degrees: 'Trap 1 tot 7 in een toonsoort',
  scales: 'Boxen en patronen', chords: 'Alle tonen van een akkoord', bends: 'Zuiver omhoog buigen', ear: 'Luister en speel na',
  challenge: 'Zoveel noten in één minuut', heatmap: 'Waar zit je zwakke plek?', metro: 'Strak op de tel', tuner: 'Stem je gitaar',
};
const PEDAL_TIP = {
  notes: 'Speel de noot op de snaar die oplicht.', positions: 'Speel dezelfde noot op elke snaar, van laag naar hoog.',
  intervals: 'Eerst de grondtoon, dan het interval.', degrees: 'Trap 1 is de grondtoon van de toonsoort.',
  scales: 'Speel de box van laag naar hoog.', chords: 'Speel alle tonen van het akkoord, in elke volgorde.',
  bends: 'Bend tot de lijn het doel raakt, en houd hem even vast.', ear: 'Luister goed en zoek de noot op de hals.',
  challenge: 'Eén minuut, zoveel mogelijk noten.', tuner: 'Speel één snaar tegelijk en laat hem uitklinken.',
};
const NO_MIC = ['metro', 'heatmap'];
// vaste knopstand per pedaal, zodat het bord er elke keer hetzelfde uitziet
const knobAngle = (id, k) => { let x = 7; for (const c of id + k) x = (x * 31 + c.charCodeAt(0)) % 997; return -130 + (x % 260); };
// pedaal intrappen: lampje aan, klik, microfoon aan en dan naar de oefening
function stomp(e, id, before) {
  e.preventDefault();
  const el = e.currentTarget, href = '#m-' + id, m = MODES[id];
  if (el.classList.contains('stomp')) return;
  el.classList.add('stomp');
  Sfx.play('tap');
  if (before) before();
  const mic = !NO_MIC.includes(id) && !Engine.mic ? Engine.startMic() : null;
  const go = () => { if (location.hash === href) Router.render(); else location.hash = href; };
  setTimeout(() => (NO_MIC.includes(id) ? go() : Loader.run({ title: m.title, sub: mic ? 'Microfoon aanzetten…' : PEDAL_TIP[id] || '', mood: 'luister', wait: mic, min: 650 }, go)), reducedMotion() ? 0 : 200);
}
function drillSub(d) {
  if (d.mode === 'intervals' && d.set && d.set.set) return 'Met ' + d.set.set.map(n => (INTERVALS.find(i => i.semis === n) || {}).name).filter(Boolean).join(' en ');
  if (d.mode === 'scales' && d.set && SCALES[d.set.scale]) return `${SCALES[d.set.scale].name} in ${d.set.root}, box ${d.set.box || 1}`;
  return PEDAL_SUB[d.mode] || '';
}
function pedal(id, o = {}) {
  const m = MODES[id];
  if (!m) return null;
  const st = Store.stats, today = (st.modeDays || {})[id] === todayKey();
  const stat = m.homeStat ? m.homeStat(st) : '';
  const color = o.color || MODE_COLOR[id] || 'leisteen';
  return h('a', { class: `pedal c-${color}${today ? ' on' : ''}${o.wide ? ' wide' : ''}`, href: '#m-' + id, 'data-mode': id, onclick: e => stomp(e, id, o.before) },
    h('span', { class: 'pd-top', 'aria-hidden': 'true' },
      h('i', { class: 'knob', style: `--a:${knobAngle(id, 'a')}deg` }), h('i', { class: 'knob', style: `--a:${knobAngle(id, 'b')}deg` }),
      h('i', { class: 'led' })),
    h('span', { class: 'pd-art', html: ART[id] || '' }),
    h('span', { class: 'pd-text' },
      o.eyebrow ? h('small', { class: 'pd-eyebrow', text: o.eyebrow }) : null,
      h('b', { class: 'pd-name', text: o.title || m.title }),
      h('span', { class: 'pd-sub', text: o.sub || PEDAL_SUB[id] || '' }),
      h('span', { class: 'pd-stat', html: today ? `Vandaag gespeeld${stat ? ', ' + stat : ''}` : stat || 'Nog niet gespeeld' })),
    h('span', { class: 'pd-switch', 'aria-hidden': 'true', html: ICONS.play }));
}
function renderPractice(view) {
  const wrap = h('section', { class: 'hub' });
  wrap.append(h('p', { class: 'hub-intro', text: 'Trap een pedaal in om te beginnen. Brandt het lampje, dan heb je die oefening vandaag al gespeeld.' }));
  const nb = Bin.count();
  wrap.append(nb
    ? h('div', { class: 'bin-card' },
      h('div', { class: 'bc-fret', html: Mascot.svg('ehbo') }),
      h('div', { class: 'bc-text' },
        h('h2', {}, 'Je foutenbak ', h('span', { class: 'bc-n bin-count', text: String(nb) })),
        h('p', { text: `${nb === 1 ? 'Eén vraag' : nb + ' vragen'} om te herstellen. Elke goede geeft bonus-XP, een lege bak 2 minuten extra voor je dagdoel.` }),
        h('button', { class: 'primary', type: 'button', html: `${ICONS.plaster}<span>Herstel je fouten</span>`, onclick: () => Bin.start() })))
    : h('div', { class: 'bin-card empty' },
      h('div', { class: 'bc-fret', html: Mascot.svg('blij', { crop: 'head' }) }),
      h('div', { class: 'bc-text' }, h('h2', { text: 'Je foutenbak is leeg' }), h('p', { text: 'Vragen die je in een les fout hebt, komen hier terecht. Herstel ze voor bonus-XP.' }))));
  const units = PathData.units(), cu = units[units.length - 1];
  if (cu) {
    const meta = unitMeta(cu), d = meta.drill;
    if (d && MODES[d.mode]) wrap.append(h('div', { class: 'hub-sec' }, h('h2', { class: 'hub-h', text: 'Past bij je les' }),
      pedal(d.mode, { wide: true, color: UNIT_COLORS[(units.length - 1) % UNIT_COLORS.length], eyebrow: `Les ${cu.lesson}: ${meta.title}`, sub: drillSub(d), before: () => { if (d.set) TempSettings.apply(d.mode, d.set); } })));
  }
  for (const sec of HUB) {
    const ids = sec.ids.filter(id => MODES[id]);
    if (!ids.length) continue;
    wrap.append(h('div', { class: 'hub-sec' }, h('h2', { class: 'hub-h', text: sec.title }),
      h('div', { class: 'pedals' + (sec.tools ? ' tools' : '') }, ids.map(id => pedal(id)))));
  }
  wrap.append(h('p', { class: 'foot', text: 'De app hoort welke toon klinkt, niet op welke snaar je hem speelt. Speel dus echt waar het gevraagd wordt, en leg je telefoon dicht bij je gitaar.' }));
  view.append(wrap);
}

// ---------- Opstarten ----------
Store.load();
$('#backBtn').addEventListener('click', () => Router.back());
$('#micPill').addEventListener('click', () => (Engine.mic ? Engine.stopMic() : Engine.startMic()));
window.addEventListener('hashchange', () => Router.render());
let lastNarrow = null, resizeT = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    const narrow = innerWidth < 600;
    if (narrow !== lastNarrow) { lastNarrow = narrow; if (current && current.draw) current.draw(); }
  }, 150);
});
// testhaak: welke tonen verwacht de huidige oefening
window.__fj = {
  mode: () => (current ? current.id || document.body.dataset.view : document.body.dataset.view),
  expected: () => {
    if (current === Lesson) {
      const it = Lesson.cur;
      if (!it || Lesson.answered || it.type !== 'play') return [];
      const st = it.steps[Lesson.ps.idx];
      if (!st) return [];
      if (st.k === 'set') return st.pcs.filter(pc => !Lesson.ps.found.has(pc)).map(pc => 48 + pc);
      if (st.k === 'rel') return [Lesson.ps.last + st.semis];
      return [48 + st.pc];
    }
    return current && current.expected ? current.expected() : [];
  },
  lesson: () => (current === Lesson && Lesson.cur ? { type: Lesson.cur.type, answer: Lesson.cur.answer, options: Lesson.cur.options, correct: Lesson.cur.correct, valid: Lesson.cur.valid, answered: Lesson.answered, done: Lesson.doneIds.size, total: Lesson.total, finished: Lesson.finished, bin: Lesson.bin } : (current === Lesson ? { finished: Lesson.finished, bin: Lesson.bin } : null)),
  loading: () => !!document.querySelector('.loader'),
  onsets: () => Engine.onsetLog.slice(),
  latency: () => Engine.latency(),
  metro: () => ({ on: Metronome.on, beats: Metronome.recent.map(b => b.t), now: Engine.ctx ? Engine.ctx.currentTime : 0, bpm: Metronome.bpm }),
  daily: () => ({ active: Daily.active, idx: Daily.idx, steps: Daily.steps.map(s => s.kind + ':' + (s.mode || '')) }),
  progress: () => ({ secs: Progress.day().secs, xp: Store.stats.xp, streak: Progress.streak(), nodes: Store.stats.path.nodes, badges: Store.stats.badges, bin: Bin.count(), binCleared: Store.stats.binCleared || 0 }),
  bin: () => Bin.list().map(x => ({ k: x.k, n: x.n, type: x.it.type })),
  settings: () => JSON.parse(JSON.stringify(Store.settings)),
  addSecs: n => { Progress.day().secs += n; Store.saveStats(); Progress.renderTop(); },
};
$('#streakChip .chip-ico').innerHTML = ICONS.flame;
$('#goalChip .chip-ico').innerHTML = ICONS.ring;
$('#micPill .chip-ico').innerHTML = ICONS.mic;
$('#logo').innerHTML = Mascot.svg('blij', { crop: 'head' });
const TAB_ICONS = { path: ICONS.path, practice: ICONS.pedal, progress: ICONS.chart };
$$('.tabbar a').forEach(a => { $('.tb-ico', a).innerHTML = TAB_ICONS[a.dataset.tab]; });
Router.render();
PathData.load();
setTimeout(() => Badges.check(), 1500);

})();
</script>
