<style>
/* Layout: telefoon eerst. Menu met oefeningen; elk oefenscherm = opdracht, hals op echte schaal, knoppen, opties, scores. */
:root {
  --bg: #ECEEF1; --surface: #FFFFFF; --surface-2: #F5F6F8; --ink: #15171C; --muted: #5D6471; --line: #D5D9E0; --led-off: #E2E5EA;
  --accent: #E8990C; --accent-ink: #15171C; --accent-text: #925600; --accent-soft: #FCEFD6;
  --ok: #1D8A4C; --ok-ink: #FFFFFF; --ok-soft: #DDF2E5; --bad: #C2412D; --bad-soft: #F9E1DC;
  --wood: #E8CB93; --wood-2: #D7B06A; --fret: #A3A9B0; --fret-hi: #EEF0F2; --nut: #F6F1E3; --inlay: #2B2420;
  --string: #7F848B; --wound: #9C7F4E; --wound-hi: #E2CFA4;
  --heat-0: #C9CED6; --heat-1: #22A05A; --heat-2: #8DBF3A; --heat-3: #E8B21C; --heat-4: #E8770C; --heat-5: #D2412D;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --surface: #181B20; --surface-2: #1F232A; --ink: #ECEEF1; --muted: #9AA2AE; --line: #2A2E36; --led-off: #252930;
    --accent: #F2A93B; --accent-ink: #15171C; --accent-text: #F4B65A; --accent-soft: #3A2C14;
    --ok: #3CC475; --ok-ink: #0C1A12; --ok-soft: #173326; --bad: #F07A62; --bad-soft: #3A1E19;
    --wood: #3B231A; --wood-2: #2C1912; --fret: #8C9299; --fret-hi: #CDD1D6; --nut: #E9E3D2; --inlay: #E8E1D1;
    --string: #B8BDC4; --wound: #B39662; --wound-hi: #E6D3A6;
    --heat-0: #4A505B; --heat-1: #34C072; --heat-2: #A3CF4A; --heat-3: #F2C230; --heat-4: #F28A2A; --heat-5: #F0604A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --surface: #181B20; --surface-2: #1F232A; --ink: #ECEEF1; --muted: #9AA2AE; --line: #2A2E36; --led-off: #252930;
  --accent: #F2A93B; --accent-ink: #15171C; --accent-text: #F4B65A; --accent-soft: #3A2C14;
  --ok: #3CC475; --ok-ink: #0C1A12; --ok-soft: #173326; --bad: #F07A62; --bad-soft: #3A1E19;
  --wood: #3B231A; --wood-2: #2C1912; --fret: #8C9299; --fret-hi: #CDD1D6; --nut: #E9E3D2; --inlay: #E8E1D1;
  --string: #B8BDC4; --wound: #B39662; --wound-hi: #E6D3A6;
  --heat-0: #4A505B; --heat-1: #34C072; --heat-2: #A3CF4A; --heat-3: #F2C230; --heat-4: #F28A2A; --heat-5: #F0604A;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased;
  padding-inline: 16px;
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
.app { max-width: 980px; margin: 0 auto; display: grid; gap: 12px; }
a { color: inherit; }

/* kop */
.top { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.brand { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 800 30px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; min-width: 0; }
body[data-view="mode"] .brand h1, body[data-view="settings"] .brand h1 { font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; overflow-wrap: normal; max-width: 100%; }
@media (max-width: 560px) {
  body[data-view="mode"] .brand h1, body[data-view="settings"] .brand h1 { font-size: 22px; }
  body:not([data-view="home"]) .pill #micText { display: none; }
  body:not([data-view="home"]) .pill { padding: 10px; }
}
.brand p { margin: 0; color: var(--muted); font-size: 14px; }
body:not([data-view="home"]) .brand p { display: none; }
.back { width: 40px; height: 40px; padding: 0; border-radius: 50%; font: 500 26px/1 var(--body); display: grid; place-items: center; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font: 500 13px/1 var(--mono); flex: none; cursor: pointer; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill[data-state="on"] { color: var(--ink); }
.pill[data-state="on"] i { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
.pill[data-state="busy"] i { background: var(--accent); }

.msg { border: 1px solid var(--bad); background: var(--bad-soft); border-radius: 10px; padding: 12px 14px; }
.okmsg { border: 1px solid var(--ok); background: var(--ok-soft); border-radius: 10px; padding: 12px 14px; font-weight: 500; }
#routineBar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 8px 8px 14px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent); font-size: 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
#routineBar .rb-txt { flex: 1; min-width: 0; }
#routineBar .rb-time { font: 600 16px/1 var(--mono); font-variant-numeric: tabular-nums; }
#routineBar button { padding: 8px 12px; font-size: 13px; border-radius: 8px; }

/* kaarten */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.eyebrow { margin: 0; font: 500 12px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.help { font-size: 13px; line-height: 1.45; color: var(--muted); }
.help.block { display: block; margin-top: 2px; }
.lead { margin: 8px 0 0; max-width: 62ch; }
.muted { color: var(--muted); }
.link { display: inline-block; margin-top: 12px; color: var(--accent-text); font-weight: 600; text-decoration: none; }

/* startscherm */
.routine-card { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.rc-head { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.rc-text { min-width: 0; flex: 1 1 260px; }
.rc-text h2 { margin: 6px 0 2px; font: 800 28px/1.05 var(--display); text-transform: uppercase; letter-spacing: .01em; }
.streak { margin: 6px 0 0; font: 500 13px/1.4 var(--mono); color: var(--accent-text); }
.rc-opts { margin-top: 10px; }
.rc-opts summary { cursor: pointer; font-size: 14px; color: var(--accent-text); font-weight: 600; }
.rc-opts .set-grid { padding: 12px 0 0; }
.group-title { margin: 10px 2px 0; }
.mode-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
@media (min-width: 640px) { .mode-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 900px) { .mode-list { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mode-item { display: grid; gap: 2px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; min-width: 0; position: relative; }
.mode-item::after { content: "›"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 24px; color: var(--muted); }
.mode-item:hover { border-color: var(--muted); }
.mi-name { font: 700 21px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; padding-right: 20px; }
.mi-desc { font-size: 14px; color: var(--muted); padding-right: 20px; }
.mi-stat { font: 500 12px/1.4 var(--mono); color: var(--accent-text); margin-top: 2px; }
.settings-link { margin-top: 4px; }
.foot { margin: 6px 2px 0; max-width: 70ch; color: var(--muted); font-size: 13px; }

/* oefenscherm */
.ex { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 900px) {
  .ex { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); align-items: start; }
  .ex > .prompt { grid-row: span 2; }
  .ex > .controls, .ex > .opts, .ex > .card:not(.prompt):not(.neck):not(.graph) { grid-column: 1 / -1; }
}
.prompt { position: relative; display: grid; gap: 4px; align-content: start; }
.note { margin: 8px 0 0; display: flex; align-items: flex-start; font: 800 clamp(96px, 26vw, 150px)/.8 var(--display); letter-spacing: -.01em; transition: color .15s ease; min-height: .8em; }
.note svg { width: .34em; height: .56em; margin: -.02em 0 0 .03em; fill: currentColor; flex: none; }
.note .deg { font-size: .62em; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
.note .sym { font-size: .42em; line-height: 1.1; margin-left: .04em; align-self: flex-start; }
.where { font: 500 19px/1.35 var(--body); text-wrap: balance; }
.where b { font-weight: 600; color: var(--accent-text); }
.where small { margin-left: 8px; font: 400 13px/1 var(--mono); color: var(--muted); white-space: nowrap; }
.leds { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
.leds span { height: 10px; border-radius: 2px; background: var(--led-off); transition: background-color .06s linear; }
.leds span.on { background: var(--accent); }
.prompt.hit .leds span { background: var(--ok); }
.prompt.hit .note, .prompt.hit .note .deg { color: var(--ok); }
.prompt.miss .note .deg { color: var(--bad); }
.toast { min-height: 1.45em; margin-top: 4px; font: 500 14px/1.45 var(--mono); color: var(--muted); }
.prompt.hit .toast { color: var(--ok); }
.prompt.miss .toast { color: var(--bad); }
.heard-line { display: flex; gap: 8px; align-items: baseline; font: 400 13px/1.4 var(--mono); color: var(--muted); }
.heard-line b { font: 700 20px/1 var(--display); color: var(--ink); letter-spacing: .01em; }
.heard-line.big b { font-size: 36px; }
.timer { position: absolute; top: 12px; right: 16px; font: 800 44px/1 var(--display); font-variant-numeric: tabular-nums; color: var(--ink); }
.timer.low { color: var(--bad); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.step { min-width: 34px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); text-align: center; font: 500 14px/1 var(--mono); color: var(--muted); }
.step.now { border-color: var(--accent); color: var(--accent-text); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.step.done { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.slots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.slot { display: grid; justify-items: center; gap: 2px; min-width: 52px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.slot small { font: 500 11px/1 var(--mono); color: var(--muted); }
.slot b { font: 700 24px/1 var(--display); }
.slot.now { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.slot.on { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.slot.on small { color: inherit; opacity: .8; }
.scale-line { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.scale-line span { display: grid; justify-items: center; padding: 4px 8px; border-radius: 8px; background: var(--surface-2); font: 600 15px/1.1 var(--body); }
.scale-line span small { font: 400 10px/1 var(--mono); color: var(--muted); }
.scale-line span.on { background: var(--ok); color: var(--ok-ink); }
.scale-line span.on small { color: inherit; }
.progress { height: 8px; border-radius: 4px; background: var(--led-off); margin-top: 12px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .1s linear; }
.prompt.hit .progress span { background: var(--ok); }
.prog-text { font: 400 13px/1.4 var(--mono); color: var(--muted); margin-top: 6px; }

/* hals */
.neck { margin: 0; padding: 10px 8px 6px; }
.neck svg { display: block; width: 100%; height: auto; }
.neck-cap { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 6px 2px; font: 400 12px/1.4 var(--mono); color: var(--muted); }
.neck-legend { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.lg { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-left: 6px; vertical-align: -1px; }
.lg.root { background: var(--muted); }
.lg.next { border: 2px solid var(--accent); }
.lg.done { background: var(--ok); }
.neck .w1 { stop-color: var(--wood); }
.neck .w2 { stop-color: var(--wood-2); }
.neck .grain { fill: none; stroke: var(--wood-2); stroke-width: 1.4; opacity: .55; }
.neck .shade { fill: var(--surface); opacity: .62; }
.neck .fretw { stroke: var(--fret); stroke-width: 4.5; }
.neck .freth { stroke: var(--fret-hi); stroke-width: 1.2; opacity: .8; }
.neck .nut { fill: var(--nut); stroke: var(--line); stroke-width: 1; }
.neck .inlay { fill: var(--inlay); }
.neck .str { stroke: var(--string); stroke-linecap: round; }
.neck .str.wound { stroke: var(--wound); }
.neck .wind { stroke: var(--wound-hi); stroke-dasharray: 1.4 2.4; opacity: .7; }
.neck .glow { stroke: var(--accent); opacity: .32; stroke-linecap: round; }
.neck .str.target { stroke: var(--accent); }
.neck .slbl { font: 500 22px var(--mono); fill: var(--muted); }
.neck .slbl.target { fill: var(--accent-text); font-weight: 600; }
.neck .fnum { font: 400 22px var(--mono); fill: var(--muted); }
.neck .mk circle { stroke-width: 3; }
.neck .mk text { font-family: var(--mono); font-weight: 600; }
.neck .mk.found circle { fill: var(--ok); stroke: var(--surface); }
.neck .mk.found text { fill: var(--ok-ink); }

<script>
(() => {
'use strict';
// ---------- Muziektheorie ----------
const OPEN = [64, 59, 55, 50, 45, 40];              // snaar 1 (hoge E) t/m 6 (lage E), MIDI
const STR_LETTER = ['e', 'B', 'G', 'D', 'A', 'E'];
const STR_NAME = ['hoge E-snaar', 'B-snaar', 'G-snaar', 'D-snaar', 'A-snaar', 'lage E-snaar'];
const GAUGE = [10, 13, 17, 26, 36, 46];
const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
const SHARP_NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const FLAT_NAMES = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];
const NATURAL = new Set([0, 2, 4, 5, 7, 9, 11]);
const ACC_SYM = { '-2': '𝄫', '-1': '♭', '0': '', '1': '♯', '2': '𝄪' };
const MAX_FRET = 19;

const mod12 = n => ((n % 12) + 12) % 12;
const octaveOf = midi => Math.floor(midi / 12) - 1;
const m2f = m => 440 * Math.pow(2, (m - 69) / 12);

function pcName(pc, pref) {
  pc = mod12(pc);
  if (NATURAL.has(pc) || pref === 'sharps' || !pref) return SHARP_NAMES[pc];
  if (pref === 'flats') return FLAT_NAMES[pc];
  return Math.random() < 0.5 ? SHARP_NAMES[pc] : FLAT_NAMES[pc];
}
const pcLabel = (pc, pref) => {
  pc = mod12(pc);
  if (NATURAL.has(pc)) return SHARP_NAMES[pc];
  return pref === 'flats' ? FLAT_NAMES[pc] : pref === 'both' ? `${SHARP_NAMES[pc]}/${FLAT_NAMES[pc]}` : SHARP_NAMES[pc];
};

// Gespelde noot: {li: letterindex 0..6, acc: -2..2}
const spPc = sp => mod12(LETTER_PC[sp.li] + sp.acc);
const spName = sp => LETTERS[sp.li] + (ACC_SYM[sp.acc] ?? '');
function parseName(name) {
  const li = LETTERS.indexOf(name[0]);
  const a = name.slice(1);
  const acc = a === '♯' ? 1 : a === '♭' ? -1 : a === '𝄪' ? 2 : a === '𝄫' ? -2 : 0;
  return { li, acc };
}
function spellFrom(root, steps, semis) {
  const li = (((root.li + steps) % 7) + 7) % 7;
  const target = mod12(spPc(root) + semis);
  let acc = target - LETTER_PC[li];
  acc = mod12(acc + 6) - 6;
  return { li, acc };
}
// eenvoudige spelling: hooguit één ♯/♭ en geen E♯, B♯, F♭, C♭
const isSimple = sp => Math.abs(sp.acc) <= 1 && !(sp.acc === 1 && (sp.li === 2 || sp.li === 6)) && !(sp.acc === -1 && (sp.li === 3 || sp.li === 0));

const DG = (steps, semis, label) => ({ steps, semis, label });

const SCALES = {
  minpent: { name: 'Mineur pentatonisch', short: 'mineur pentatonisch', degs: [DG(0, 0, 'R'), DG(2, 3, '♭3'), DG(3, 5, '4'), DG(4, 7, '5'), DG(6, 10, '♭7')], perString: 2, minorish: true },
  majpent: { name: 'Majeur pentatonisch', short: 'majeur pentatonisch', degs: [DG(0, 0, 'R'), DG(1, 2, '2'), DG(2, 4, '3'), DG(4, 7, '5'), DG(5, 9, '6')], perString: 2 },
  blues: { name: 'Blues', short: 'blues', degs: [DG(0, 0, 'R'), DG(2, 3, '♭3'), DG(3, 5, '4'), DG(4, 6, '♭5'), DG(4, 7, '5'), DG(6, 10, '♭7')], base: 'minpent', minorish: true },
  major: { name: 'Majeur (ionisch)', short: 'majeur', degs: [DG(0, 0, 'R'), DG(1, 2, '2'), DG(2, 4, '3'), DG(3, 5, '4'), DG(4, 7, '5'), DG(5, 9, '6'), DG(6, 11, '7')], perString: 3 },
  minor: { name: 'Mineur (eolisch)', short: 'mineur', degs: [DG(0, 0, 'R'), DG(1, 2, '2'), DG(2, 3, '♭3'), DG(3, 5, '4'), DG(4, 7, '5'), DG(5, 8, '♭6'), DG(6, 10, '♭7')], perString: 3, minorish: true },
  dorian: { name: 'Dorisch', short: 'dorisch', degs: [DG(0, 0, 'R'), DG(1, 2, '2'), DG(2, 3, '♭3'), DG(3, 5, '4'), DG(4, 7, '5'), DG(5, 9, '6'), DG(6, 10, '♭7')], perString: 3, minorish: true },
  mixo: { name: 'Mixolydisch', short: 'mixolydisch', degs: [DG(0, 0, 'R'), DG(1, 2, '2'), DG(2, 4, '3'), DG(3, 5, '4'), DG(4, 7, '5'), DG(5, 9, '6'), DG(6, 10, '♭7')], perString: 3 },
};
const MINOR_ROOTS = ['A', 'E', 'B', 'F♯', 'C♯', 'G♯', 'D', 'G', 'C', 'F', 'B♭', 'E♭'];
const MAJOR_ROOTS = ['C', 'G', 'D', 'A', 'E', 'B', 'F♯', 'F', 'B♭', 'E♭', 'A♭', 'D♭'];
const rootsFor = scaleId => (SCALES[scaleId].minorish ? MINOR_ROOTS : MAJOR_ROOTS);

function scaleTones(scaleId, rootName) {
  const root = parseName(rootName);
  return SCALES[scaleId].degs.map(d => {
    const sp = spellFrom(root, d.steps, d.semis);
    return { pc: spPc(sp), name: spName(sp), label: d.label, semis: d.semis };
  });
}

// Box/positie: opeenvolgende toonladdertonen, 2 (pentatonisch) of 3 (diatonisch) per snaar,
// beginnend op de lage E bij de (box-1)e toon boven de grondtoon.
function scaleBox(scaleId, rootName, box) {
  const sc = SCALES[scaleId];
  const baseId = sc.base || scaleId;
  const base = SCALES[baseId];
  const tones = scaleTones(baseId, rootName);
  const n = tones.length;
  const rootPc = tones[0].pc;
  const rf = mod12(rootPc - 4);                       // grondtoon op de lage E (open E = pc 4)
  let k = (box - 1) % n;
  let midi = OPEN[5] + rf + base.degs[k].semis;
  if (midi - OPEN[5] > 12) midi -= 12;
  const pos = [];
  for (let s = 5; s >= 0; s--) {
    for (let j = 0; j < base.perString; j++) {
      const t = tones[k];
      pos.push({ s, f: midi - OPEN[s], midi, pc: t.pc, name: t.name, label: t.label });
      const cur = base.degs[k].semis;
      k = (k + 1) % n;
      const next = base.degs[k].semis;
      midi += mod12(next - cur) || 12;
    }
  }
  if (pos.some(p => p.f < 0)) for (const p of pos) { p.midi += 12; p.f += 12; }   // past niet in open positie: octaaf hoger
  if (sc.base) {
    // blues: voeg de ♭5 toe binnen het bereik van de box
    const all = scaleTones(scaleId, rootName);
    const extra = all.filter(t => !tones.some(b => b.pc === t.pc));
    const lo = Math.min(...pos.map(p => p.f)), hi = Math.max(...pos.map(p => p.f));
    for (const t of extra) {
      for (let s = 0; s < 6; s++) {
        for (let f = lo; f <= hi; f++) {
          if (mod12(OPEN[s] + f) === t.pc) pos.push({ s, f, midi: OPEN[s] + f, pc: t.pc, name: t.name, label: t.label });
        }
      }
    }
  }
  pos.sort((a, b) => a.midi - b.midi || b.s - a.s);
  // dubbele toonhoogtes (zelfde noot op twee snaren) houden we maar één keer: de eerste
  const out = [];
  for (const p of pos) if (!out.some(q => q.midi === p.midi)) out.push(p);
  return out;
}
const boxCount = scaleId => SCALES[SCALES[scaleId].base || scaleId].degs.length;

const CHORDS = {
  maj: { sym: '', name: 'majeur', tones: [DG(0, 0, 'R'), DG(2, 4, '3'), DG(4, 7, '5')] },
  min: { sym: 'm', name: 'mineur', tones: [DG(0, 0, 'R'), DG(2, 3, '♭3'), DG(4, 7, '5')] },
  dom7: { sym: '7', name: 'dominant 7', tones: [DG(0, 0, 'R'), DG(2, 4, '3'), DG(4, 7, '5'), DG(6, 10, '♭7')] },
  maj7: { sym: 'maj7', name: 'groot 7', tones: [DG(0, 0, 'R'), DG(2, 4, '3'), DG(4, 7, '5'), DG(6, 11, '7')] },
  m7: { sym: 'm7', name: 'mineur 7', tones: [DG(0, 0, 'R'), DG(2, 3, '♭3'), DG(4, 7, '5'), DG(6, 10, '♭7')] },
  m7b5: { sym: 'm7♭5', name: 'half-verminderd', tones: [DG(0, 0, 'R'), DG(2, 3, '♭3'), DG(4, 6, '♭5'), DG(6, 10, '♭7')] },
  dim: { sym: '°', name: 'verminderd', tones: [DG(0, 0, 'R'), DG(2, 3, '♭3'), DG(4, 6, '♭5')] },
  sus4: { sym: 'sus4', name: 'sus4', tones: [DG(0, 0, 'R'), DG(3, 5, '4'), DG(4, 7, '5')] },
};
const CHORD_ROOTS = ['C', 'C♯', 'D♭', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
function chordTones(type, rootName) {
  const root = parseName(rootName);
  return CHORDS[type].tones.map(d => {
    const sp = spellFrom(root, d.steps, d.semis);
    return { pc: spPc(sp), name: spName(sp), label: d.label, simple: isSimple(sp) };
  });
}
const chordOk = (type, rootName) => isSimple(parseName(rootName)) && chordTones(type, rootName).every(t => t.simple);

const INTERVALS = [
  { semis: 1, steps: 1, name: 'kleine secunde', short: 'k2' },
  { semis: 2, steps: 1, name: 'grote secunde', short: 'g2' },
  { semis: 3, steps: 2, name: 'kleine terts', short: 'k3' },
  { semis: 4, steps: 2, name: 'grote terts', short: 'g3' },
  { semis: 5, steps: 3, name: 'reine kwart', short: '4' },
  { semis: 6, steps: 3, name: 'tritonus', short: 'tt' },
  { semis: 7, steps: 4, name: 'reine kwint', short: '5' },
  { semis: 8, steps: 5, name: 'kleine sext', short: 'k6' },
  { semis: 9, steps: 5, name: 'grote sext', short: 'g6' },
  { semis: 10, steps: 6, name: 'kleine septiem', short: 'k7' },
  { semis: 11, steps: 6, name: 'grote septiem', short: 'g7' },
  { semis: 12, steps: 7, name: 'octaaf', short: '8' },
];
const fretWord = n => (Math.abs(n) === 1 ? 'fret' : 'frets');
function shapeText(semis, up) {
  // vorm op de hals, van een snaar naar de volgende hogere (omhoog) of lagere (omlaag) snaar
  const sign = up ? 1 : -1;
  const move = d => (d === 0 ? 'zelfde fret' : d > 0 ? `${d} ${fretWord(d)} verder` : `${-d} ${fretWord(d)} terug`);
  if (semis === 12) {
    return up ? 'Twee snaren hoger, 2 frets verder. Ga je over de B-snaar heen, dan 3 frets verder.'
      : 'Twee snaren lager, 2 frets terug. Ga je over de B-snaar heen, dan 3 frets terug.';
  }
  const d = sign * (semis - 5), dgb = sign * (semis - 4);
  let t = `${up ? 'Eén snaar hoger' : 'Eén snaar lager'}: ${move(d)}. Tussen G- en B-snaar: ${move(dgb)}.`;
  if (semis <= 5) t = `Op dezelfde snaar: ${semis} ${fretWord(semis)} ${up ? 'verder' : 'terug'}. ` + t;
  return t;
}

// ---------- Toonhoogte (McLeod Pitch Method) ----------
function createDetector(N, sr, minF, maxF) {
  const maxTau = Math.min(Math.floor(sr / minF) + 2, N - 2);
  const minTau = Math.max(2, Math.floor(sr / maxF));
  const nsdf = new Float32Array(maxTau + 2);
  const x = new Float32Array(N), sq = new Float32Array(N);
  return function detect(buf) {
    let mean = 0;
    for (let i = 0; i < N; i++) mean += buf[i];
    mean /= N;
    let energy = 0;
    for (let i = 0; i < N; i++) { const v = buf[i] - mean; x[i] = v; sq[i] = v * v; energy += sq[i]; }
    const rms = Math.sqrt(energy / N);
    if (energy <= 1e-12) return { freq: 0, clarity: 0, rms };
    let m = 2 * energy;
    for (let tau = 0; tau <= maxTau + 1; tau++) {
      if (tau > 0) m -= sq[tau - 1] + sq[N - tau];
      let r = 0;
      const lim = N - tau;
      for (let j = 0; j < lim; j++) r += x[j] * x[j + tau];
      nsdf[tau] = m > 1e-12 ? (2 * r) / m : 0;
    }
    let tau = 1;
    while (tau <= maxTau && nsdf[tau] > 0) tau++;
    const peaks = [];
    let best = -1, bestV = -Infinity;
    for (; tau <= maxTau; tau++) {
      const v = nsdf[tau];
      if (v > 0) { if (v > bestV) { bestV = v; best = tau; } }
      else if (best >= 0) { peaks.push(best); best = -1; bestV = -Infinity; }
    }
    if (best >= 0 && best < maxTau) peaks.push(best);
    let highest = 0;
    for (const p of peaks) if (p >= minTau && nsdf[p] > highest) highest = nsdf[p];
    if (highest <= 0) return { freq: 0, clarity: 0, rms };
    const thr = 0.9 * highest;
    let t = -1;
    for (const p of peaks) if (p >= minTau && nsdf[p] >= thr) { t = p; break; }
    const a = nsdf[t - 1], b = nsdf[t], c = nsdf[t + 1];
    const den = a - 2 * b + c;
    const shift = den !== 0 ? (0.5 * (a - c)) / den : 0;
    return { freq: sr / (t + shift), clarity: b - 0.25 * (a - c) * shift, rms };
  };
}

// ---------- Nootvolger: maakt losse noten van de stroom toonhoogtes ----------
const NOTE_MIN_MS = 100;
function createNoteTracker(emit) {
  let cand = null, candStart = 0, emitted = null, lastVoiced = -1e9;
  return {
    reset() { cand = null; emitted = null; },
    onset() { cand = null; emitted = null; },
    frame(f, now) {
      if (f.midi == null) { if (now - lastVoiced > 160) { cand = null; emitted = null; } return; }
      lastVoiced = now;
      const n = Math.round(f.midi);
      if (Math.abs(f.midi - n) > 0.42) { cand = null; return; }
      if (n !== cand) { cand = n; candStart = now; return; }
      if (now - candStart < NOTE_MIN_MS || n === emitted) return;
      if (emitted != null && Math.abs(n - emitted) === 12) return;   // octaaffout van dezelfde noot
      emitted = n;
      emit({ midi: n, midiF: f.midi, t: now });
    }
  };
}

// ---------- Gitaarklank (Karplus-Strong) ----------
function ksSamples(sr, midi, dur) {
  const n = Math.floor(sr * dur), y = new Float32Array(n);
  const f0 = m2f(midi), P = sr / f0 - 0.5;
  const L = Math.min(n, Math.ceil(P) + 2);
  let prev = 0;
  for (let i = 0; i < L; i++) { const w = Math.random() * 2 - 1; prev = prev * 0.45 + w * 0.55; y[i] = prev; }
  const loss = midi < 52 ? 0.997 : 0.995;
  for (let i = L; i < n; i++) {
    const d = i - P, i0 = Math.floor(d), fr = d - i0;
    const a = y[i0] * (1 - fr) + y[i0 + 1] * fr;
    const b = y[i0 - 1] * (1 - fr) + y[i0] * fr;
    y[i] = loss * 0.5 * (a + b);
  }
  let mx = 0;
  for (let i = 0; i < n; i++) mx = Math.max(mx, Math.abs(y[i]));
  if (mx > 0) for (let i = 0; i < n; i++) y[i] *= 0.9 / mx;
  return y;
}

// ---------- Aanslagdetectie (AudioWorklet) ----------
const ONSET_WORKLET = `
class FjOnset extends AudioWorkletProcessor {
  constructor() { super(); this.slow = 1e-7; this.last = -1; this.minE = 4e-6; this.port.onmessage = e => { if (e.data && e.data.minE) this.minE = e.data.minE; }; }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    let e = 0;
    for (let i = 0; i < ch.length; i++) e += ch[i] * ch[i];
    e /= ch.length;
    const t = currentTime;
    if (e > this.minE && e > 4 * this.slow && t - this.last > 0.09) { this.last = t; this.port.postMessage({ t: t, e: e }); }
    this.slow = this.slow * 0.97 + e * 0.03;
    return true;
  }
}
registerProcessor('fj-onset', FjOnset);`;

// ---------- Geluidsmotor ----------
const Engine = {
  ctx: null, stream: null, nodes: null, analyser: null, buf: null, detect: null, onsetNode: null, workletReady: false,
  mic: false, starting: false, raf: 0, lastTs: 0, prevDb: -120, blockUntil: 0, sink: null, wakeLock: null,

  ensureCtx() {

    }

  },

  async startMic() {
    if (this.mic || this.starting) return this.mic;
    UI.hideMsg();

    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    const analyser = ctx.createAnalyser();

        }

    this.mic = true; this.starting = false; this.lastTs = performance.now(); this.heardHist = [];

  },

  stopMic() {
    if (!this.mic) return;

    cancelAnimationFrame(this.raf);
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    if (this.nodes) { try { this.nodes.src.disconnect(); this.nodes.lp.disconnect(); this.nodes.analyser.disconnect(); } catch (e) {} }

    this.stream = null; this.nodes = null; this.analyser = null;

  syncGate() {

  },

  async requestWake() {

  loop(ts) {

  onsetLog: [],
  onOnset(d) {

  blip() {

};

// ---------- Metronoom ----------
const Metronome = {
  on: false, bpm: 80, beats: 4, accent: true, next: 0, beatIdx: 0, timer: 0, onBeat: null, recent: [],
  start() {
    const ctx = Engine.ensureCtx();
    this.on = true; this.beatIdx = 0; this.next = ctx.currentTime + 0.12; this.recent = [];
    clearInterval(this.timer);
    this.timer = setInterval(() => this.tick(), 25);
    this.tick();
  },
  stop() { this.on = false; clearInterval(this.timer); },
  tick() {
    const ctx = Engine.ctx;
    if (!this.on || !ctx) return;
    const spb = 60 / this.bpm;
    while (this.next < ctx.currentTime + 0.12) {
      const idx = this.beatIdx % this.beats, accent = this.accent && idx === 0;
      Engine.click(this.next, accent);
      this.recent.push({ t: this.next, idx });
      if (this.recent.length > 32) this.recent.shift();
      const delay = Math.max(0, (this.next - ctx.currentTime) * 1000);
      if (this.onBeat) setTimeout(() => this.on && this.onBeat && this.onBeat(idx), delay);
      this.next += spb; this.beatIdx++;
    }
  },
  nearest(t) {
    let best = null;
    for (const b of this.recent) if (!best || Math.abs(b.t - t) < Math.abs(best.t - t)) best = b;
    return best;
  }
};

function drawNeck(svg, o) {

  const S = (W - 12 - X0) / (d(to + 0.45) - d(leftN));
  const xOf = n => X0 + S * (d(n) - d(leftN));
  const cellW = f => (f === 0 ? 40 : xOf(f) - xOf(f - 1));
  const midOf = f => (f === 0 ? X0 - 32 : (xOf(f - 1) + xOf(f)) / 2);
  const yOf = s => TOP + 14 + s * GAP;
  const yB = TOP + BOARD_H;
  const hl = new Set(o.highlight || []);
  const strStart = from === 0 ? X0 - 52 : X0 - 18;
  svg.setAttribute('viewBox', `0 0 ${W} 244`);
  let h = '<defs><linearGradient id="fjwood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="w1"/><stop offset=".5" class="w2"/><stop offset="1" class="w1"/></linearGradient></defs>';
  h += `<rect x="${X0}" y="${TOP}" width="${W - X0}" height="${BOARD_H}" fill="url(#fjwood)"/>`;
  for (let i = 0; i < 9; i++) {
    const y = TOP + 10 + i * (BOARD_H - 20) / 8, a = 3 + (i * 7) % 5, ph = i * 1.7;
    let p = `M${X0} ${y.toFixed(1)}`;
    for (let x = X0 + 60; x <= W; x += 60) p += ` L${x} ${(y + a * Math.sin(x / 140 + ph)).toFixed(1)}`;
    h += `<path class="grain" d="${p}"/>`;
  }
  if (o.range) {
    for (let f = Math.max(1, from); f <= to; f++) {
      if (f < o.range.min || f > o.range.max) h += `<rect class="shade" x="${xOf(f - 1).toFixed(1)}" y="${TOP}" width="${cellW(f).toFixed(1)}" height="${BOARD_H}"/>`;
    }
    if (to >= o.range.max) h += `<rect class="shade" x="${xOf(to).toFixed(1)}" y="${TOP}" width="${(W - xOf(to)).toFixed(1)}" height="${BOARD_H}"/>`;
  }
  const midY = (yOf(2) + yOf(3)) / 2;
  for (let f = Math.max(1, from); f <= to; f++) {
    if ([3, 5, 7, 9, 15, 17, 19].includes(f)) h += `<circle class="inlay" cx="${midOf(f).toFixed(1)}" cy="${midY}" r="8"/>`;
    if (f === 12) h += `<circle class="inlay" cx="${midOf(f).toFixed(1)}" cy="${(yOf(1) + yOf(2)) / 2}" r="8"/><circle class="inlay" cx="${midOf(f).toFixed(1)}" cy="${(yOf(3) + yOf(4)) / 2}" r="8"/>`;
  }

// ---------- Gedeeld: noten op snaren ----------
const TOL = 0.45, HOLD = 0.18, COOLDOWN = 700;
const NoteGame = {
  pool(focusKeys) {
    const s = Store.settings, pool = [];
    for (const st of s.strings) {
      const by = new Map();
      for (let f = s.minFret; f <= s.maxFret; f++) {
        const pc = mod12(OPEN[st] + f);
        if (s.naturalsOnly && !NATURAL.has(pc)) continue;
        if (!by.has(pc)) by.set(pc, []);
        by.get(pc).push(f);
      }
      for (const [pc, frets] of by) pool.push({ s: st, pc, frets });
    }
    if (focusKeys && focusKeys.length) {
      const fp = pool.filter(it => focusKeys.includes(it.s + '-' + it.pc));
      if (fp.length) return fp;
    }
    return pool;
  },
  pick(prev, focusKeys) {
    const pool = this.pool(focusKeys);
    let cands = pool.filter(it => !prev || it.pc !== prev.pc);
    if (!cands.length) cands = pool;
    const items = Store.stats.notes.items;
    const w = cands.map(it => { const st = items[it.s + '-' + it.pc]; return st && st.n ? 1 + Math.min(2.5, st.total / st.n / 4) : 1.6; });
    let r = Math.random() * w.reduce((a, b) => a + b, 0), it = cands[cands.length - 1];
    for (let i = 0; i < cands.length; i++) { r -= w[i]; if (r <= 0) { it = cands[i]; break; } }
    return { s: it.s, pc: it.pc, frets: it.frets, name: pcName(it.pc, Store.settings.names), midis: it.frets.map(f => OPEN[it.s] + f) };
  },
  matches(t, m) {
    if (Store.settings.strict) return t.midis.some(v => Math.abs(m - v) <= TOL);
    const d = mod12(m - t.pc);
    return Math.min(d, 12 - d) <= TOL;
  },
  fretsFor(t, m) {
    if (!Store.settings.strict) return t.frets;
    let bi = 0;
    t.midis.forEach((v, i) => { if (Math.abs(m - v) < Math.abs(m - t.midis[bi])) bi = i; });
    return [t.frets[bi]];
  },
  record(t, secs, hinted) {
    const st = Store.stats.notes, key = t.s + '-' + t.pc;
    const it = st.items[key] || (st.items[key] = { n: 0, total: 0 });
    it.n++; it.total += secs;
    st.found++; st.totalTime += secs;
    if (!hinted && (st.best == null || secs < st.best)) st.best = secs;
    if (!hinted && secs <= 5) { st.streak++; st.bestStreak = Math.max(st.bestStreak, st.streak); } else st.streak = 0;
    Store.saveStats();
  },
  // hold-meter: true zodra de juiste toon lang genoeg klinkt
  hold(state, f, dt, matchFn) {
    if (f.midi == null) state.hold = Math.max(0, state.hold - dt / 0.6);
    else if (matchFn(f.midi)) state.hold = Math.min(1, state.hold + dt / HOLD);
    else state.hold = Math.max(0, state.hold - dt / 0.25);
    return state.hold >= 1;
  }
};
const rangeCaption = () => `Oefenbereik: fret ${Store.settings.minFret} t/m ${Store.settings.maxFret} · ${Store.settings.strings.length} ${Store.settings.strings.length === 1 ? 'snaar' : 'snaren'}`;

  },
  success(m) {
    this.done = true;
    const t = this.target, frets = NoteGame.fretsFor(t, m), secs = this.elapsed;
    this.marks = frets.map(f => ({ s: t.s, f, kind: 'found', label: t.name }));
    this.draw();
    this.card.classList.add('hit');
    setLeds(this.card, 1);
    $('.pr-toast', this.card).textContent = `Goed! Fret ${frets.join(' en ')} · ${fmt1(secs)} s`;
    NoteGame.record(t, secs, this.hinted);
    this.renderStats();
    Engine.ding();
    this.timer = setTimeout(() => this.next(), COOLDOWN);
  },
  renderStats() {
    const st = Store.stats.notes;
    this.statsEl.innerHTML = '';
    this.statsEl.append(h('p', { class: 'eyebrow', text: 'Scores' }), statFigs([
      { label: 'Gevonden', value: String(st.found) },

      { label: 'Snelste', value: sec(st.best) },
      { label: 'Reeks < 5 s', value: `${st.streak}${st.bestStreak ? `<small>beste ${st.bestStreak}</small>` : ''}` },
    ]), h('a', { class: 'link', href: '#m-heatmap', text: 'Bekijk je hittekaart ›' }));
  },

registerMode({
  id: 'positions', group: 'hals', title: 'Alle posities', desc: 'Speel dezelfde noot op elke snaar',
  homeStat: st => (st.positions.done ? `${st.positions.done}× rond · snelste ${fmt1(st.positions.best)} s` : ''),
  mount(view) {
    this.card = promptCard('Speel op elke snaar');
    const s = Store.settings.positions;
    this.statsEl = h('div', { class: 'card' });
    const L = exLayout(view, {
      prompt: this.card, caption: h('span', { text: rangeCaption() }),
      actions: [{ id: 'hintBtn', label: 'Hint', key: 'h', onClick: () => this.hint() }, { id: 'skipBtn', label: 'Overslaan', key: 's', onClick: () => this.next() }],
      options: [field('Volgorde', seg([{ value: 'up', label: 'lage E → hoge e' }, { value: 'down', label: 'hoge e → lage E' }], s.order, v => { s.order = v; Store.saveSettings(); this.next(); }))],
      stats: this.statsEl,
    });
    this.svg = L.svg; this.keys = L.keys;
    this.pc = null;
    this.next();
    this.renderStats();
  },
  unmount() { clearTimeout(this.timer); },
  next() {
    clearTimeout(this.timer);
    const S = Store.settings;
    const order = S.strings.slice().sort((a, b) => (S.positions.order === 'up' ? b - a : a - b));
    let pcs = Array.from({ length: 12 }, (_, i) => i).filter(pc => !S.naturalsOnly || NATURAL.has(pc));
    if (this.pc != null) pcs = pcs.filter(pc => pc !== this.pc);
    pcs = shuffle(pcs);
    let steps = [];
    for (const pc of pcs) {
      steps = order.map(s => {
        const frets = [];
        for (let f = S.minFret; f <= S.maxFret; f++) if (mod12(OPEN[s] + f) === pc) frets.push(f);
        return { s, frets, midis: frets.map(f => OPEN[s] + f) };
      }).filter(st => st.frets.length);
      if (steps.length >= Math.min(2, order.length)) { this.pc = pc; break; }
    }
    this.steps = steps; this.idx = 0; this.marks = []; this.elapsed = 0; this.done = false; this.hinted = false; this.lastAccepted = null;
    this.name = pcName(this.pc, S.names);
    $('.pr-note', this.card).innerHTML = bigNoteHTML(this.name);
    $('.pr-note', this.card).setAttribute('aria-label', spoken(this.name));
    $('.pr-where', this.card).innerHTML = S.positions.order === 'up' ? 'van de <b>lage E</b> naar de <b>hoge e</b>' : 'van de <b>hoge e</b> naar de <b>lage E</b>';
    $('.pr-leds', this.card).hidden = true;
    this.card.classList.remove('hit');
    $('.pr-toast', this.card).textContent = Engine.mic ? '' : 'Druk op Start en sta de microfoon toe.';
    this.renderSteps();
    this.draw();
  },
  renderSteps() {
    $('.pr-extra', this.card).innerHTML = `<div class="steps">${this.steps.map((st, i) => `<span class="step${i < this.idx ? ' done' : i === this.idx && !this.done ? ' now' : ''}">${STR_LETTER[st.s]}</span>`).join('')}</div>`;
  },
  draw() {
    const S = Store.settings, cur = this.steps[this.idx];
    drawNeck(this.svg, { from: 0, to: Math.max(12, S.maxFret), highlight: cur && !this.done ? [cur.s] : [], marks: this.marks, range: { min: S.minFret, max: S.maxFret } });
  },
  expected() { const st = this.steps[this.idx]; return this.done || !st ? [] : st.midis; },
  hint() {
    const st = this.steps[this.idx];
    if (!st || this.done) return;
    this.hinted = true;
    this.marks = this.marks.filter(m => m.kind !== 'hint').concat(st.frets.map(f => ({ s: st.s, f, kind: 'hint', label: this.name })));
    this.draw();
    $('.pr-toast', this.card).textContent = `Hint: ${STR_NAME[st.s]}, fret ${st.frets.join(' of ')}`;
  },
  onOnset(o) { this.lastOnset = o.perfT; },
  onFrame(f, dt) {
    if (this.done) return;
    this.elapsed += dt;
    // zelfde toonhoogte als de vorige stap (bijv. lage E fret 5 en open A): opnieuw aanslaan telt
    const la = this.lastAccepted, st = this.steps[this.idx];
    if (!la || f.midi == null || !st || this.lastOnset === la.onset || f.t - this.lastOnset < 120) return;
    const m = Math.round(f.midi);
    if (m === la.midi && Math.abs(f.midi - m) <= TOL && (Store.settings.strict ? st.midis.includes(m) : mod12(m) === this.pc)) this.accept(m);
  },
  onNote(n) {
    if (this.done) return;
    const st = this.steps[this.idx];
    if (this.lastAccepted && n.midi === this.lastAccepted.midi && this.lastOnset === this.lastAccepted.onset) return;
    const ok = Store.settings.strict ? st.midis.some(v => v === n.midi) : mod12(n.midi) === this.pc;
    if (!ok) { $('.pr-toast', this.card).textContent = `Je speelde ${pcName(n.midi, Store.settings.names === 'flats' ? 'flats' : 'sharps')}. Zoek ${this.name} op de ${STR_NAME[st.s]}.`; return; }
    this.accept(n.midi);
  },
  accept(midi) {
    const st = this.steps[this.idx];
    const n = { midi };
    this.lastAccepted = { midi, onset: this.lastOnset };
    let bi = 0;
    st.midis.forEach((v, i) => { if (Math.abs(n.midi - v) < Math.abs(n.midi - st.midis[bi])) bi = i; });
    this.marks = this.marks.filter(m => m.kind !== 'hint').concat([{ s: st.s, f: st.frets[bi], kind: 'found', label: this.name }]);
    this.idx++;
    $('.pr-toast', this.card).textContent = this.idx < this.steps.length ? `Goed, nu de ${STR_NAME[this.steps[this.idx].s]}` : '';
    if (this.idx >= this.steps.length) return this.success();
    this.renderSteps(); this.draw();
  },
  success() {
    this.done = true;
    const ps = Store.stats.positions, secs = this.elapsed;
    ps.done++;
    if (!this.hinted && (ps.best == null || secs < ps.best)) ps.best = secs;
    Store.saveStats();
    this.card.classList.add('hit');
    $('.pr-toast', this.card).textContent = `Alle ${this.name}'s gevonden in ${fmt1(secs)} s`;
    this.renderSteps(); this.draw(); this.renderStats();
    Engine.ding();
    this.timer = setTimeout(() => this.next(), 1600);
  },
  renderStats() {
    const ps = Store.stats.positions;
    this.statsEl.innerHTML = '';
    this.statsEl.append(h('p', { class: 'eyebrow', text: 'Scores' }), statFigs([{ label: 'Rondes', value: String(ps.done) }, { label: 'Snelste ronde', value: sec(ps.best) }]));
  },
});

// ---------- Intervallen ----------
registerMode({
  id: 'intervals', group: 'hals', title: 'Intervallen', desc: 'Speel een toon en dan het interval erboven of eronder',
  homeStat: st => (st.intervals.n ? `${st.intervals.n} goed · gemiddeld ${fmt1(st.intervals.total / st.intervals.n)} s` : ''),
  mount(view) {
    this.card = promptCard('Interval');
    const s = Store.settings.intervals;
    this.statsEl = h('div', { class: 'card' });
    const L = exLayout(view, {
      prompt: this.card,
      actions: [{ id: 'hintBtn', label: 'Hint', key: 'h', onClick: () => this.hint() }, { id: 'skipBtn', label: 'Overslaan', key: 's', onClick: () => this.next() }],
      options: [
        field('Welke intervallen', chips(INTERVALS.map(i => ({ value: i.semis, label: i.name })), s.set.map(String), v => { s.set = v.map(Number); Store.saveSettings(); }, 1)),
        field('Richting', seg([{ value: 'up', label: 'omhoog' }, { value: 'down', label: 'omlaag' }, { value: 'both', label: 'beide' }], s.dir, v => { s.dir = v; Store.saveSettings(); this.next(); })),
        field('Begintonen', checkEl('natRoots', 'Alleen stamtonen als begintoon', s.naturalRoots, v => { s.naturalRoots = v; Store.saveSettings(); })),
      ],
      stats: this.statsEl,
    });
    this.svg = L.svg; this.keys = L.keys;
    this.next();
    this.renderStats();
  },
  unmount() { clearTimeout(this.timer); },
  next() {
    clearTimeout(this.timer);
    const s = Store.settings.intervals;
    let root, target, iv, up;
    for (let tries = 0; tries < 50; tries++) {
      const sm = Number(pick(s.set));
      iv = INTERVALS.find(i => i.semis === sm);
      up = s.dir === 'up' ? true : s.dir === 'down' ? false : Math.random() < 0.5;
      const pcs = Array.from({ length: 12 }, (_, i) => i).filter(pc => !s.naturalRoots || NATURAL.has(pc));
      const rn = pcName(pick(pcs), Store.settings.names);
      root = parseName(rn);
      target = spellFrom(root, up ? iv.steps : -iv.steps, up ? iv.semis : -iv.semis);
      if (isSimple(root) && isSimple(target) && (!this.root || spPc(root) !== spPc(this.root) || iv !== this.iv)) break;
    }
    Object.assign(this, { root, target, iv, up, phase: 'root', rootMidi: null, elapsed: 0, done: false, hinted: false, marks: [] });
    const rn = spName(root);
    $('.pr-note', this.card).innerHTML = bigNoteHTML(rn);
    $('.pr-note', this.card).setAttribute('aria-label', spoken(rn));
    $('.pr-where', this.card).innerHTML = `<b>${iv.name}</b> ${up ? 'erboven' : 'eronder'}`;
    $('.pr-leds', this.card).hidden = true;
    this.card.classList.remove('hit');
    $('.pr-toast', this.card).textContent = Engine.mic ? `Speel eerst ${rn}` : 'Druk op Start en sta de microfoon toe.';
    this.renderSteps();
    drawNeck(this.svg, { from: 0, to: 12, marks: [] });
  },
  renderSteps() {
    const rn = spName(this.root);
    $('.pr-extra', this.card).innerHTML = `<div class="steps wide"><span class="step${this.phase !== 'root' ? ' done' : ' now'}">1 · ${rn}</span><span class="step${this.done ? ' done' : this.phase === 'target' ? ' now' : ''}">2 · ${this.done ? spName(this.target) : '?'}</span></div>`;
  },
  example() {
    // voorbeeldvorm op de hals: grondtoon en interval op naburige snaren
    const rootPc = spPc(this.root), semis = this.iv.semis;
    const order = this.up ? [5, 4, 3, 2, 1] : [0, 1, 2, 3, 4];
    for (const s of order) {
      for (let f = 1; f <= 10; f++) {
        if (mod12(OPEN[s] + f) !== rootPc) continue;
        const goal = OPEN[s] + f + (this.up ? semis : -semis);
        const cands = this.up ? [s - 1, s - 2] : [s + 1, s + 2];
        for (const t of cands) {
          if (t < 0 || t > 5) continue;
          const tf = goal - OPEN[t];
          if (tf >= 0 && tf <= 15 && Math.abs(tf - f) <= 4) return [{ s, f, kind: 'todo root', label: spName(this.root) }, { s: t, f: tf, kind: 'found', label: spName(this.target) }];
        }
      }
    }
    return [];
  },
  expected() {
    if (this.done) return [];
    if (this.phase === 'root') return [48 + spPc(this.root)];
    return [this.rootMidi + (this.up ? this.iv.semis : -this.iv.semis)];
  },
  hint() {
    if (this.done) return;
    this.hinted = true;
    this.marks = this.example();
    drawNeck(this.svg, { from: 0, to: 12, marks: this.marks });
    $('.pr-toast', this.card).textContent = `${spName(this.target)}. ${shapeText(this.iv.semis, this.up)}`;
  },
  onFrame(f, dt) { if (!this.done) this.elapsed += dt; },
  onNote(n) {
    if (this.done) return;
    const toast = $('.pr-toast', this.card);
    const heard = pcName(n.midi, Store.settings.names === 'flats' ? 'flats' : 'sharps');
    if (this.phase === 'root') {
      if (mod12(n.midi) !== spPc(this.root)) { toast.textContent = `Je speelde ${heard}. Begin met ${spName(this.root)}.`; return; }
      this.rootMidi = n.midi; this.phase = 'target';
      toast.textContent = `Nu de ${this.iv.name} ${this.up ? 'erboven' : 'eronder'}`;
      this.renderSteps();
      return;
    }
    const want = this.rootMidi + (this.up ? this.iv.semis : -this.iv.semis);
    const octave = this.iv.semis === 12;
    if (!octave && mod12(n.midi) === spPc(this.root)) return;   // grondtoon klinkt nog
    const ok = Store.settings.strict || octave ? n.midi === want : mod12(n.midi) === mod12(want);
    if (!ok) { toast.textContent = `Je speelde ${heard}. Dat is niet de ${this.iv.name}.`; return; }
    this.done = true;
    const st = Store.stats.intervals; st.n++; st.total += this.elapsed; Store.saveStats();
    this.card.classList.add('hit');
    toast.textContent = `Goed! ${spName(this.root)} → ${spName(this.target)} · ${this.iv.name}, ${this.iv.semis} halve ${this.iv.semis === 1 ? 'toon' : 'tonen'}`;
    this.renderSteps();
    this.marks = this.example();
    drawNeck(this.svg, { from: 0, to: 12, marks: this.marks });
    this.renderStats();
    Engine.ding();
    this.timer = setTimeout(() => this.next(), 2200);
  },
  renderStats() {

    this.seq = s.order === 'updown' ? this.box.concat(this.box.slice(0, -1).reverse()) : this.box.slice();
    this.idx = 0; this.errors = 0; this.t0 = null; this.done = false; this.played = [];

  renderProgress() {
    const s = Store.settings.scales, best = Store.stats.scales.best[`${s.scale}-${s.root}-${s.box}-${s.order}`];
    $('.pr-extra', this.card).innerHTML = `<div class="progress"><span style="width:${(100 * this.idx / this.seq.length).toFixed(1)}%"></span></div><div class="prog-text">${this.idx}/${this.seq.length} noten${this.errors ? ` · ${this.errors} mis` : ''}${best ? ` · record ${fmt1(best)} s` : ''}</div>`;
  },
  draw() {
    const s = Store.settings.scales;
    const lo = Math.min(...this.box.map(p => p.f)), hi = Math.max(...this.box.map(p => p.f));
    const from = Math.max(0, lo - 1), to = Math.max(from + 5, hi + 1);
    const cur = this.done ? null : this.seq[this.idx];
    const marks = [];
    for (const p of this.box) {
      const isPlayed = this.played.some(q => q.s === p.s && q.f === p.f);
      const isCur = cur && cur.s === p.s && cur.f === p.f;
      if (s.labels === 'none' && !isPlayed) continue;
      const label = s.labels === 'degrees' ? p.label : p.name;
      let kind = isPlayed ? 'found' : 'todo';
      if (isCur) kind = 'next';
      if (p.label === 'R') kind += ' root';
      marks.push({ s: p.s, f: p.f, kind, label });
    }
    drawNeck(this.svg, { from, to, marks, highlight: cur && s.labels !== 'none' ? [cur.s] : [] });

    if (this.done) return;

    if (!ok) {
      const prev = this.seq[this.idx - 1];
      if (prev && (n.midi === prev.midi || (!Store.settings.strict && mod12(n.midi) === prev.pc))) return;   // vorige noot klinkt nog
      this.errors++;
      $('.pr-toast', this.card).textContent = Store.settings.scales.labels === 'none' ? 'Mis. Probeer het nog eens.' : `Je speelde ${pcName(n.midi, 'sharps')}, de volgende is ${exp.name}`;
      this.renderProgress();
      return;
    }
    if (this.t0 == null) this.t0 = n.t;
    this.played.push(exp);
    this.idx++;
    $('.pr-toast', this.card).textContent = '';
    if (this.idx >= this.seq.length) return this.success(n.t);
    if (Store.settings.scales.order === 'updown' && this.idx === this.box.length) this.played = [exp];   // terugweg: opnieuw kleuren
    this.renderProgress(); this.draw();
  },
  success(t) {
    this.done = true;
    const s = Store.settings.scales, secs = (t - this.t0) / 1000;
    const st = Store.stats.scales, key = `${s.scale}-${s.root}-${s.box}-${s.order}`;
    st.runs++;
    const rec = !this.errors && (st.best[key] == null || secs < st.best[key]);
    if (rec) st.best[key] = secs;
    Store.saveStats();
    this.card.classList.add('hit');
    $('.pr-toast', this.card).textContent = `Klaar in ${fmt1(secs)} s${this.errors ? ` met ${this.errors} mis` : rec ? ' · nieuw record' : ''}. Nog een keer!`;

    this.statsEl.append(h('p', { class: 'eyebrow', text: 'Scores' }), statFigs([{ label: 'Keer gespeeld', value: String(st.runs) }, { label: 'Record deze box', value: sec(best) }]));
  },
});

    const avg = hs.length ? hs.reduce((a, b) => a + b, 0) / hs.length : 0;
    const sd = hs.length ? Math.sqrt(hs.reduce((a, b) => a + (b - avg) * (b - avg), 0) / hs.length) : 0;
    const tight = hs.length ? Math.round(100 * hs.filter(v => Math.abs(v) <= 25).length / hs.length) : 0;
    const word = v => (Math.abs(v) <= 10 ? 'precies op de tel' : `${Math.round(Math.abs(v))} ms ${v < 0 ? 'te vroeg' : 'te laat'}`);
    const pos = v => clamp(50 + v / 2, 1, 99);
    this.timing.innerHTML = '';
    this.timing.append(
      h('p', { class: 'eyebrow', text: 'Op de tel' }),
      h('div', { class: 'last-hit' + (last == null ? '' : Math.abs(last) <= 25 ? ' good' : Math.abs(last) <= 50 ? ' near' : ' off'), text: last == null ? (Metronome.on ? 'Speel mee met de klik' : 'Start de metronoom en speel mee') : word(last) }),
      h('div', { class: 'strip', html: `<span class="zone"></span><span class="mid"></span>${hs.map((v, i) => `<i class="${i === hs.length - 1 ? 'last' : ''}" style="left:${pos(v).toFixed(1)}%"></i>`).join('')}<em class="l">te vroeg</em><em class="r">te laat</em>` }),
      statFigs([
        { label: 'Gemiddeld', value: hs.length ? `${Math.round(Math.abs(avg))}<small>ms ${avg < 0 ? 'vroeg' : 'laat'}</small>` : '–' },
        { label: 'Spreiding', value: hs.length ? `±${Math.round(sd)}<small>ms</small>` : '–' },
        { label: 'Strak', value: hs.length ? `${tight}<small>%</small>` : '–' },
      ]));
  },
});

// ---------- 60 seconden ----------
registerMode({
  id: 'challenge', group: 'uitdaging', title: '60 seconden', desc: 'Zoveel mogelijk noten vinden in één minuut',
  homeStat: st => (st.challenge.best ? `record ${st.challenge.best} noten` : ''),
  mount(view) {
    this.card = promptCard('Uitdaging');
    this.timerEl = h('div', { class: 'timer', text: '60' });
    this.card.prepend(this.timerEl);
    this.statsEl = h('div', { class: 'card' });
    const L = exLayout(view, {
      prompt: this.card, caption: h('span', { text: rangeCaption() }),
      actions: [{ id: 'goBtn', label: 'Begin', key: 'b', onClick: () => this.begin() }],
      stats: this.statsEl,
    });
    this.svg = L.svg; this.keys = L.keys;
    this.goBtn = $('#goBtn', L.ctrl);
    this.ready();
    this.renderStats();
  },
  unmount() { clearInterval(this.iv); clearTimeout(this.cd); this.state = 'off'; },
  ready() {
    this.state = 'ready';
    this.timerEl.textContent = '60';
    $('.pr-note', this.card).innerHTML = '<span class="deg">60 s</span>';
    $('.pr-where', this.card).innerHTML = `Zoveel mogelijk noten op de juiste snaar${Store.stats.challenge.best ? `<small>record ${Store.stats.challenge.best}</small>` : ''}`;
    $('.pr-toast', this.card).textContent = Engine.mic ? 'Druk op Begin' : 'Druk op Start en daarna op Begin';
    $('.pr-leds', this.card).hidden = false;
    setLeds(this.card, 0);
    this.card.classList.remove('hit');
    drawNeck(this.svg, { from: 0, to: Math.max(12, Store.settings.maxFret), range: { min: Store.settings.minFret, max: Store.settings.maxFret } });
  },
  async begin() {
    if (this.state === 'run' || this.state === 'count') return;
    if (!Engine.mic && !(await Engine.startMic())) return;
    this.state = 'count';
    let n = 3;
    const step = () => {
      if (this.state !== 'count') return;
      if (n === 0) return this.run();
      $('.pr-note', this.card).innerHTML = `<span class="deg">${n}</span>`;
      $('.pr-where', this.card).textContent = 'Maak je klaar…';
      n--; this.cd = setTimeout(step, 800);
    };
    step();
  },
  run() {
    this.state = 'run'; this.score = 0; this.times = []; this.endsAt = performance.now() + 60000;
    this.target = null; this.nextTarget();
    clearInterval(this.iv);
    this.iv = setInterval(() => {
      const left = Math.max(0, Math.ceil((this.endsAt - performance.now()) / 1000));
      this.timerEl.textContent = String(left);
      this.timerEl.classList.toggle('low', left <= 10);
      if (left <= 0) this.end();
    }, 200);
  },
  nextTarget() {
    this.target = NoteGame.pick(this.target);
    this.hold = { hold: 0 }; this.elapsed = 0;
    const t = this.target;
    $('.pr-note', this.card).innerHTML = bigNoteHTML(t.name);
    $('.pr-where', this.card).innerHTML = `op de <b>${STR_NAME[t.s]}</b><small>${this.score} gevonden</small>`;
    $('.pr-toast', this.card).textContent = '';
    setLeds(this.card, 0);
    drawNeck(this.svg, { from: 0, to: Math.max(12, Store.settings.maxFret), highlight: [t.s], range: { min: Store.settings.minFret, max: Store.settings.maxFret } });
  },
  expected() { return this.state === 'run' ? this.target.midis : []; },
  onFrame(f, dt) {
    if (this.state !== 'run') return;
    this.elapsed += dt;
    const ok = NoteGame.hold(this.hold, f, dt, m => NoteGame.matches(this.target, m));
    setLeds(this.card, this.hold.hold);
    if (ok) {
      this.score++; this.times.push(this.elapsed);
      NoteGame.record(this.target, this.elapsed, false);
      Engine.blip();
      this.nextTarget();
    }
  },
  end() {
    clearInterval(this.iv);
    this.state = 'end';
    const st = Store.stats.challenge, rec = this.score > st.best;
    st.runs++; st.last = this.score;
    if (rec) st.best = this.score;
    Store.saveStats();
    this.timerEl.textContent = '0';
    this.card.classList.add('hit');
    $('.pr-note', this.card).innerHTML = `<span class="deg">${this.score}</span>`;
    const avg = this.times.length ? this.times.reduce((a, b) => a + b, 0) / this.times.length : 0;
    $('.pr-where', this.card).innerHTML = `${this.score === 1 ? 'noot' : 'noten'} gevonden${this.times.length ? `<small>gemiddeld ${fmt1(avg)} s</small>` : ''}`;
    $('.pr-toast', this.card).textContent = rec && this.score ? 'Nieuw record!' : `Record: ${st.best}. Druk op Begin voor een nieuwe ronde.`;
    setLeds(this.card, 0);
    Engine.chime();
    this.renderStats();
  },
  renderStats() {
    const st = Store.stats.challenge;
    this.statsEl.innerHTML = '';
    this.statsEl.append(h('p', { class: 'eyebrow', text: 'Scores' }), statFigs([{ label: 'Record', value: String(st.best) }, { label: 'Vorige ronde', value: String(st.last) }, { label: 'Rondes', value: String(st.runs) }]));
  },
});

// ---------- Hittekaart ----------
const heatLevel = avg => (avg < 2 ? 1 : avg < 3.5 ? 2 : avg < 5 ? 3 : avg < 8 ? 4 : 5);
registerMode({
  id: 'heatmap', group: 'uitdaging', title: 'Hittekaart', desc: 'Zie in één oogopslag welke plekken je nog lastig vindt',
  homeStat: st => { const n = Object.keys(st.notes.items).length; return n ? `${n} van 72 plekken geoefend` : ''; },
  mount(view) {
    const items = Store.stats.notes.items, S = Store.settings, to = Math.max(12, S.maxFret);
    const intro = h('div', { class: 'card' },
      h('p', { class: 'eyebrow', text: 'Hoe snel vind je elke noot?' }),
      h('p', { class: 'lead', text: 'Elke stip is een plek op de hals. Groen vind je snel, rood duurt lang, grijs heb je nog niet geoefend. Gebaseerd op Noten zoeken en de 60-secondenuitdaging.' }),
      h('div', { class: 'legend', html: '<span><i class="hz h1"></i>&lt; 2 s</span><span><i class="hz h2"></i>2–3,5 s</span><span><i class="hz h3"></i>3,5–5 s</span><span><i class="hz h4"></i>5–8 s</span><span><i class="hz h5"></i>&gt; 8 s</span><span><i class="hz h0"></i>nog niet</span>' }));
    const rows = Object.entries(items).filter(([, v]) => v.n > 0).map(([k, v]) => { const [s, pc] = k.split('-').map(Number); return { k, s, pc, avg: v.total / v.n, n: v.n }; }).sort((a, b) => b.avg - a.avg);
    this.weak = rows.slice(0, 8).map(r => r.k);
    const list = h('div', { class: 'card hard' }, h('p', { class: 'eyebrow', text: 'Zwakste plekken' }),
      rows.length ? h('ol', {}, rows.slice(0, 5).map(r => h('li', {}, h('span', { text: `${pcLabel(r.pc, S.names)} op de ${STR_NAME[r.s]}` }), h('span', { text: `${fmt1(r.avg)} s · ${r.n}×` })))) : h('p', { class: 'help', text: 'Nog geen gegevens. Speel eerst een paar rondes Noten zoeken.' }));
    const L = exLayout(view, {
      prompt: intro, mic: false,
      caption: h('span', { text: 'Op geoefende plekken staat de notenaam' }),
      actions: rows.length ? [{ id: 'focusBtn', label: 'Oefen je zwakste plekken', cls: 'primary', onClick: () => { MODES.notes.focus = this.weak; location.hash = '#m-notes'; } }] : [{ id: 'goNotes', label: 'Naar Noten zoeken', cls: 'primary', onClick: () => { location.hash = '#m-notes'; } }],
      stats: list,
    });
    const marks = [];
    for (let s = 0; s < 6; s++) for (let f = 0; f <= to; f++) {
      const pc = mod12(OPEN[s] + f), it = items[s + '-' + pc];
      const seen = it && it.n;
      marks.push({ s, f, kind: 'heat h' + (seen ? heatLevel(it.total / it.n) : 0), label: seen ? pcName(pc, S.names === 'flats' ? 'flats' : 'sharps') : '' });
    }
    drawNeck(L.svg, { from: 0, to, marks });
    this.keys = L.keys;
  },
});

// ---------- Stemapparaat ----------
registerMode({
  id: 'tuner', group: 'handig', title: 'Stemapparaat', desc: 'Stem je gitaar, met referentietonen per snaar',
  mount(view) {
    this.card = h('div', { class: 'card prompt tuner-card' },
      h('p', { class: 'eyebrow', text: 'Stemmen' }),
      this.noteEl = h('div', { class: 'note tn-note', html: '<span>–</span>' }),
      this.infoEl = h('div', { class: 'where', text: Engine.mic ? 'Speel een open snaar' : 'Druk op Start' }),
      h('div', { class: 'meter big', 'aria-hidden': 'true' }, h('div', { class: 'zone' }), h('div', { class: 'track' }), h('div', { class: 'tick', style: 'left:50%' }), this.needle = h('div', { class: 'needle', hidden: true }), h('div', { class: 'scale', html: '<span>−50</span><span>0 cent</span><span>+50</span>' })));
    this.strBtns = h('div', { class: 'str-btns' }, [5, 4, 3, 2, 1, 0].map(s => h('button', { type: 'button', 'data-s': String(s), html: `${STR_LETTER[s]}<small>${pcName(OPEN[s], 'sharps')}${octaveOf(OPEN[s])}</small>`, onclick: () => { Engine.pluck(OPEN[s], Engine.ensureCtx().currentTime + 0.02, 1.4, 0.8); Engine.block(1500); } })));
    const L = exLayout(view, { prompt: this.card, neck: false, middle: h('div', { class: 'card' }, h('p', { class: 'eyebrow', text: 'Tik voor een referentietoon' }), this.strBtns) });
    this.keys = L.keys;
    UI.tuner = (hh, n, c, nm) => this.update(hh, n, c, nm);
  },
  unmount() { UI.tuner = null; },
  onMic(on) { this.infoEl.textContent = on ? 'Speel een open snaar' : 'Druk op Start'; },
  update(hh, n, c, nm) {
    if (!hh) { this.needle.hidden = true; $$('button', this.strBtns).forEach(b => b.classList.remove('near', 'ok')); return; }
    this.noteEl.innerHTML = bigNoteHTML(nm) + `<span class="sym">${octaveOf(n)}</span>`;
    let best = null;
    for (let s = 0; s < 6; s++) { const d = hh.midi - OPEN[s]; if (Math.abs(d) <= 2.5 && (!best || Math.abs(d) < Math.abs(best.d))) best = { s, d }; }
    let cents = c;
    if (best) {
      cents = Math.round(best.d * 100);
      const ok = Math.abs(cents) <= 5;
      this.infoEl.textContent = `${STR_NAME[best.s]} · ${ok ? 'gestemd' : `${Math.abs(cents)} cent ${cents < 0 ? 'te laag, draai hoger' : 'te hoog, draai lager'}`}`;
      $$('button', this.strBtns).forEach(b => { const on = Number(b.dataset.s) === best.s; b.classList.toggle('near', on && !ok); b.classList.toggle('ok', on && ok); });
    } else this.infoEl.textContent = `${c > 0 ? '+' : c < 0 ? '−' : ''}${Math.abs(c)} cent`;
    this.needle.hidden = false;
    this.needle.style.left = `${clamp(50 + cents, 1, 99)}%`;
    this.needle.classList.toggle('ok', Math.abs(cents) <= 5);
  },
});

// ---------- Routine ----------
const ROUTINE_BLOCKS = {
  scales: { title: 'Toonladders' }, notes: { title: 'Noten zoeken' }, positions: { title: 'Alle posities' },
  intervals: { title: 'Intervallen' }, degrees: { title: 'Trappen' }, chords: { title: 'Akkoordtonen' },
  ear: { title: 'Op gehoor' }, bends: { title: 'Bends' },
};
const Routine = {
  active: false, idx: 0, left: 0, timer: 0, blocks: [], justDone: null,
  start() {
    const s = Store.settings.routine;
    this.blocks = s.blocks.slice(); this.idx = 0; this.left = s.minutes * 60; this.active = true; this.justDone = null;
    clearInterval(this.timer);
    this.timer = setInterval(() => this.tick(), 1000);
    if (!Engine.mic) Engine.startMic();
    this.go();
  },
  go() { location.hash = '#m-' + this.blocks[this.idx]; },
  tick() {
    if (!this.active) return;
    const onBlock = current && current.id === this.blocks[this.idx];
    if (Engine.mic && onBlock && document.visibilityState === 'visible') {
      this.left--;
      if (this.left <= 0) return this.nextBlock(true);
    }
    this.renderBar();
  },
  nextBlock(auto) {
    if (auto) Engine.chime();
    this.idx++;
    if (this.idx >= this.blocks.length) return this.finish();
    this.left = Store.settings.routine.minutes * 60;
    this.go();
  },
  finish() {
    this.active = false; clearInterval(this.timer);
    const days = Store.stats.routine.days, t = todayKey();
    if (!days.includes(t)) days.push(t);
    while (days.length > 400) days.shift();
    Store.saveStats();
    this.justDone = { minutes: this.blocks.length * Store.settings.routine.minutes };
    if (location.hash === '' || location.hash === '#') Router.render(); else location.hash = '';
  },
  stop() { this.active = false; clearInterval(this.timer); $('#routineBar').hidden = true; },
  decorate() { this.renderBar(); },
  renderBar() {
    const bar = $('#routineBar');
    if (!this.active) { bar.hidden = true; return; }
    bar.hidden = false;
    const id = this.blocks[this.idx], onBlock = current && current.id === id;
    const mm = `${Math.floor(this.left / 60)}:${String(this.left % 60).padStart(2, '0')}`;
    const html = onBlock
      ? `<span class="rb-txt"><b>Routine ${this.idx + 1}/${this.blocks.length}</b> · ${ROUTINE_BLOCKS[id].title}${Engine.mic ? '' : ' · gepauzeerd'}</span><span class="rb-time">${mm}</span>`
      : `<span class="rb-txt"><b>Routine gepauzeerd</b> · ${ROUTINE_BLOCKS[id].title}</span>`;
    if (bar._html === html + onBlock) return;
    bar._html = html + onBlock;
    bar.innerHTML = html;
    bar.append(onBlock ? h('button', { type: 'button', text: 'Volgende', onclick: () => this.nextBlock(false) }) : h('button', { type: 'button', text: 'Ga verder', onclick: () => this.go() }), h('button', { type: 'button', text: 'Stop', onclick: () => this.stop() }));
  },
  streak() {
    const days = new Set(Store.stats.routine.days);
    const d = new Date();
    const key = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
    const today = days.has(key(d));
    if (!today) d.setDate(d.getDate() - 1);
    let n = 0;
    while (days.has(key(d))) { n++; d.setDate(d.getDate() - 1); }
    return { n, today };
  },
};

// ---------- Opstarten ----------
Store.load();
$('#backBtn').addEventListener('click', () => { location.hash = ''; });
$('#micPill').addEventListener('click', () => (Engine.mic ? Engine.stopMic() : Engine.startMic()));
window.addEventListener('hashchange', () => Router.render());
let lastNarrow = null, resizeT = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    const narrow = innerWidth < 600;
    if (narrow !== lastNarrow) { lastNarrow = narrow; if (current && current.draw) current.draw(); }
  }, 150);
});
// testhaak: welke tonen verwacht de huidige oefening
window.__fj = {
  mode: () => (current ? current.id : null),
  expected: () => (current && current.expected ? current.expected() : []),
  routine: () => ({ active: Routine.active, idx: Routine.idx, left: Routine.left }),
  onsets: () => Engine.onsetLog.slice(),
  latency: () => Engine.latency(),
  metro: () => ({ on: Metronome.on, beats: Metronome.recent.map(b => b.t), now: Engine.ctx ? Engine.ctx.currentTime : 0, bpm: Metronome.bpm }),
};
Router.render();

})();
